<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DrawLab V5.4</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --bg:#f7f5ff;
    --panel:#ffffff;
    --primary:#8b7cf6;
    --primary-dark:#6f60dc;
    --pink:#ff8fb1;
    --text:#332f44;
    --muted:#817b91;
    --border:#e8e3f3;
    --shadow:
        0 10px 30px rgba(90,75,130,.12);

}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    font-family:
        Arial,
        "Noto Naskh Arabic",
        Tahoma,
        sans-serif;

    background:var(--bg);

    color:var(--text);

    overflow:hidden;

}


/* =========================================================
   HEADER
========================================================= */

header{

    height:64px;

    background:white;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 18px;

    position:relative;

    z-index:100;

}


.logo{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:20px;

    font-weight:800;

    color:var(--primary);

}


.logo-icon{

    width:38px;

    height:38px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ddd7ff,
            #ffd9e6
        );

}


/* =========================================================
   MAIN
========================================================= */

.main{

    height:
        calc(100vh - 64px);

    display:flex;

    position:relative;

}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

    flex:1;

    min-width:0;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


/* =========================================================
   CANVAS WRAPPER
========================================================= */

.canvas-wrap{

    position:relative;

    width:
        min(92vw,1100px);

    height:
        min(82vh,720px);

    display:flex;

    align-items:center;

    justify-content:center;

}


#canvas{

    background:white;

    border:
        1px solid #ddd7e8;

    border-radius:18px;

    box-shadow:
        0 18px 50px
        rgba(80,65,120,.15);

    max-width:100%;

    max-height:100%;

    touch-action:none;

}


/* =========================================================
   ZOOM
========================================================= */

.zoom-controls{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    gap:6px;

    background:white;

    border:
        1px solid var(--border);

    border-radius:14px;

    padding:6px;

    box-shadow:var(--shadow);

    z-index:30;

}


.zoom-controls button{

    border:0;

    background:#f3f0fb;

    width:34px;

    height:34px;

    border-radius:9px;

    cursor:pointer;

    font-size:18px;

}


#zoomValue{

    min-width:54px;

    text-align:center;

    font-size:12px;

    font-weight:700;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    width:70px;

    background:white;

    border-right:
        1px solid var(--border);

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:7px;

    padding:10px 7px;

    overflow-y:auto;

    z-index:50;

}


.tool{

    width:52px;

    height:46px;

    border:0;

    background:transparent;

    border-radius:13px;

    cursor:pointer;

    font-size:20px;

    transition:.2s;

    position:relative;

}


.tool:hover{

    background:#f3efff;

}


.tool.active{

    background:
        linear-gradient(
            135deg,
            #eeeaff,
            #ffeaf2
        );

    color:var(--primary-dark);

}


.tool span{

    display:block;

    font-size:9px;

    margin-top:2px;

    font-weight:700;

}


/* =========================================================
   PANEL
========================================================= */

.panel{

    width:320px;

    background:white;

    border-left:
        1px solid var(--border);

    overflow-y:auto;

    padding:16px;

    box-shadow:
        -10px 0 30px
        rgba(80,65,120,.06);

    z-index:60;

}


.panel.hidden{

    display:none;

}


.panel-close{

    display:none;

    position:absolute;

    top:12px;

    right:12px;

    width:32px;

    height:32px;

    border:0;

    border-radius:10px;

    background:#f4f0fb;

    cursor:pointer;

}


/* =========================================================
   PANEL SECTIONS
========================================================= */

.panel-section{

    margin-bottom:20px;

}


.panel-title{

    font-size:14px;

    font-weight:800;

    margin-bottom:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.control{

    margin-bottom:12px;

}


.control label{

    display:flex;

    justify-content:space-between;

    margin-bottom:6px;

    font-size:11px;

    color:var(--muted);

    font-weight:700;

}


input[type="range"]{

    width:100%;

    accent-color:var(--primary);

}


button{

    font-family:inherit;

}


.primary-btn{

    width:100%;

    border:0;

    border-radius:12px;

    padding:10px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #a99dff
        );

    color:white;

    font-weight:800;

    cursor:pointer;

}


/* =========================================================
   COLOR PALETTE
========================================================= */

.palette{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:7px;

}


.color-dot{

    width:28px;

    height:28px;

    border-radius:9px;

    border:
        2px solid white;

    box-shadow:
        0 0 0 1px #ddd7e8;

    cursor:pointer;

}


.color-dot.active{

    box-shadow:
        0 0 0 2px var(--primary);

}


/* =========================================================
   BRUSH PRESETS
========================================================= */

.brush-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

}


.brush-card{

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:9px 5px;

    background:#fff;

    cursor:pointer;

    text-align:center;

    font-size:10px;

}


.brush-card.active{

    border-color:
        var(--primary);

    background:#f4f1ff;

}


/* =========================================================
   FONT
========================================================= */

.font-select{

    width:100%;

    padding:10px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:white;

    outline:none;

}


.text-input{

    width:100%;

    min-height:70px;

    resize:vertical;

    border:
        1px solid var(--border);

    border-radius:10px;

    padding:10px;

    font-size:14px;

    outline:none;

}


/* =========================================================
   FABRIC
========================================================= */

.fabric-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

}


.fabric-card{

    border:
        1px solid var(--border);

    border-radius:13px;

    padding:10px;

    cursor:pointer;

    background:white;

}


.fabric-card.active{

    border-color:
        var(--primary);

    background:#f5f2ff;

}


.fabric-preview{

    height:48px;

    border-radius:9px;

    margin-bottom:7px;

}


.fabric-card strong{

    display:block;

    font-size:11px;

}


.fabric-card small{

    color:var(--muted);

    font-size:9px;

}


.fabric-control{

    margin-top:12px;

}


.fabric-control label{

    display:flex;

    justify-content:space-between;

    font-size:11px;

    font-weight:700;

    color:var(--muted);

    margin-bottom:6px;

}


.fabric-mode-btn{

    width:100%;

    border:0;

    border-radius:12px;

    padding:11px;

    margin-top:10px;

    background:#f1edff;

    color:#6758c7;

    font-weight:800;

    cursor:pointer;

}


/* =========================================================
   OBJECT BUTTONS
========================================================= */

.object-actions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;

}


.object-actions button{

    border:
        1px solid var(--border);

    background:white;

    border-radius:10px;

    padding:9px 5px;

    cursor:pointer;

    font-size:11px;

}


/* =========================================================
   LAYERS
========================================================= */

.layers{

    display:flex;

    flex-direction:column;

    gap:6px;

}


.layer{

    display:flex;

    align-items:center;

    gap:7px;

    padding:8px;

    border:
        1px solid var(--border);

    border-radius:10px;

    cursor:pointer;

    font-size:11px;

}


.layer.selected{

    background:#f2efff;

    border-color:
        var(--primary);

}


.layer-name{

    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    body{
        overflow:hidden;
    }

    header{
        height:56px;
    }

    .main{

        height:
            calc(100vh - 56px);

        flex-direction:column;

    }

    .workspace{

        order:1;

        height:
            calc(100% - 72px);

    }

    .toolbar{

        order:2;

        width:100%;

        height:72px;

        min-height:72px;

        flex-direction:row;

        overflow-x:auto;

        overflow-y:hidden;

        border-right:0;

        border-top:
            1px solid var(--border);

        padding:7px;

    }

    .tool{

        min-width:54px;

        height:54px;

    }

    .panel{

        position:absolute;

        left:8px;

        right:8px;

        bottom:80px;

        width:auto;

        max-height:
            calc(100vh - 150px);

        border:
            1px solid var(--border);

        border-radius:18px;

        box-shadow:
            0 20px 50px
            rgba(60,50,100,.22);

    }

    .panel-close{
        display:block;
    }

    .canvas-wrap{

        width:94vw;

        height:78vh;

    }

    .zoom-controls{

        bottom:8px;

    }

}


/* =========================================================
   DESKTOP PANEL
========================================================= */

@media(min-width:851px){

    .panel{
        position:relative;
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{

    width:6px;
    height:6px;

}


::-webkit-scrollbar-thumb{

    background:#d8d2e7;

    border-radius:10px;

}

</style>

</head>

<body>


<header>

    <div class="logo">

        <div class="logo-icon">
            🎨
        </div>

        DrawLab

    </div>

    <div>

        <button
            onclick="newProject()"
            style="
                border:0;
                background:#f2effb;
                border-radius:10px;
                padding:8px 12px;
                cursor:pointer;
                font-weight:700;
            "
        >
            New
        </button>

    </div>

</header>


<div class="main">


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div class="toolbar">


        <button
            class="tool"
            data-tool="menu"
            onclick="togglePanel()"
        >
            ☰
            <span>Menu</span>
        </button>


        <button
            class="tool active"
            data-tool="select"
            onclick="setTool('select')"
        >
            🖱️
            <span>Select</span>
        </button>


        <button
            class="tool"
            data-tool="brush"
            onclick="setTool('brush')"
        >
            🖌️
            <span>Brush</span>
        </button>


        <button
            class="tool"
            data-tool="eraser"
            onclick="setTool('eraser')"
        >
            🧽
            <span>Eraser</span>
        </button>


        <button
            class="tool"
            data-tool="fill"
            onclick="setTool('fill')"
        >
            🪣
            <span>Fill</span>
        </button>


        <button
            class="tool"
            data-tool="picker"
            onclick="setTool('picker')"
        >
            💧
            <span>Picker</span>
        </button>


        <button
            class="tool"
            data-tool="line"
            onclick="setTool('line')"
        >
            ╱
            <span>Line</span>
        </button>


        <button
            class="tool"
            data-tool="rect"
            onclick="setTool('rect')"
        >
            ▭
            <span>Rect</span>
        </button>


        <button
            class="tool"
            data-tool="circle"
            onclick="setTool('circle')"
        >
            ○
            <span>Circle</span>
        </button>


        <button
            class="tool"
            data-tool="text"
            onclick="setTool('text')"
        >
            T
            <span>Text</span>
        </button>


        <button
            class="tool"
            data-tool="fabric"
            onclick="toggleFabricStudio()"
        >
            🧵
            <span>Fabric</span>
        </button>


        <button
            class="tool"
            onclick="document.getElementById('imageInput').click()"
        >
            🖼️
            <span>Image</span>
        </button>


        <button
            class="tool"
            onclick="undo()"
        >
            ↩️
            <span>Undo</span>
        </button>


        <button
            class="tool"
            onclick="redo()"
        >
            ↪️
            <span>Redo</span>
        </button>


        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
            onchange="uploadImage(event)"
        >


    </div>


    <!-- =====================================================
         WORKSPACE
    ====================================================== -->

    <div class="workspace">


        <div class="canvas-wrap">


            <canvas
                id="canvas"
                width="1100"
                height="700"
            ></canvas>


            <div class="zoom-controls">

                <button onclick="changeZoom(-.1)">
                    −
                </button>

                <span id="zoomValue">
                    100%
                </span>

                <button onclick="changeZoom(.1)">
                    +
                </button>

                <button onclick="resetZoom()">
                    ⛶
                </button>

            </div>


        </div>


    </div>


    <!-- =====================================================
         PANEL
    ====================================================== -->

    <aside
        class="panel"
        id="panel"
    >

        <button
            class="panel-close"
            onclick="closePanel()"
        >
            ✕
        </button>


        <!-- FABRIC STUDIO -->

        <section
            class="panel-section"
            id="fabricStudio"
        >

            <div class="panel-title">

                🧵 Fabric Studio

                <span>
                    150×150
                </span>

            </div>


            <div class="fabric-grid">


                <div
                    class="fabric-card active"
                    onclick="setFabric('satin',this)"
                >

                    <div
                        class="fabric-preview"
                        style="
                            background:
                            linear-gradient(
                                120deg,
                                #ddd,
                                #fff,
                                #cfcfcf
                            );
                        "
                    ></div>

                    <strong>
                        Satin
                    </strong>

                    <small>
                        Glossy
                    </small>

                </div>


                <div
                    class="fabric-card"
                    onclick="setFabric('silk',this)"
                >

                    <div
                        class="fabric-preview"
                        style="
                            background:
                            linear-gradient(
                                120deg,
                                #eee,
                                #fff,
                                #ddd
                            );
                        "
                    ></div>

                    <strong>
                        Silk
                    </strong>

                    <small>
                        Soft shine
                    </small>

                </div>


                <div
                    class="fabric-card"
                    onclick="setFabric('chiffon',this)"
                >

                    <div
                        class="fabric-preview"
                        style="
                            background:
                            repeating-linear-gradient(
                                45deg,
                                #eee,
                                #eee 3px,
                                #f8f8f8 3px,
                                #f8f8f8 6px
                            );
                        "
                    ></div>

                    <strong>
                        Chiffon
                    </strong>

                    <small>
                        Light
                    </small>

                </div>


                <div
                    class="fabric-card"
                    onclick="setFabric('crepe',this)"
                >

                    <div
                        class="fabric-preview"
                        style="
                            background:
                            radial-gradient(
                                circle,
                                #ddd 1px,
                                #eee 2px
                            );
                            background-size:6px 6px;
                        "
                    ></div>

                    <strong>
                        Crepe
                    </strong>

                    <small>
                        Grainy
                    </small>

                </div>


                <div
                    class="fabric-card"
                    onclick="setFabric('velvet',this)"
                >

                    <div
                        class="fabric-preview"
                        style="
                            background:
                            linear-gradient(
                                120deg,
                                #777,
                                #aaa,
                                #666
                            );
                        "
                    ></div>

                    <strong>
                        Velvet
                    </strong>

                    <small>
                        Soft
                    </small>

                </div>


                <div
                    class="fabric-card"
                    onclick="setFabric('cotton',this)"
                >

                    <div
                        class="fabric-preview"
                        style="
                            background:
                            repeating-linear-gradient(
                                0deg,
                                #eee,
                                #eee 2px,
                                #ddd 3px
                            );
                        "
                    ></div>

                    <strong>
                        Cotton
                    </strong>

                    <small>
                        Natural
                    </small>

                </div>


            </div>


            <div class="fabric-control">

                <label>

                    <span>
                        ✨ Shine
                    </span>

                    <span id="shineValue">
                        50
                    </span>

                </label>

                <input
                    type="range"
                    id="shineSlider"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>


            <div class="fabric-control">

                <label>

                    <span>
                        🧶 Texture
                    </span>

                    <span id="textureValue">
                        45
                    </span>

                </label>

                <input
                    type="range"
                    id="textureSlider"
                    min="0"
                    max="100"
                    value="45"
                >

            </div>


            <!-- PATTERN REPEAT -->

            <div class="fabric-control">

                <label>

                    <span>
                        🔁 Pattern Repeat
                    </span>

                    <span id="patternValue">
                        Grid
                    </span>

                </label>

                <select
                    id="patternType"
                    class="font-select"
                >

                    <option value="grid">
                        Grid
                    </option>

                    <option value="brick">
                        Brick
                    </option>

                    <option value="halfdrop">
                        Half Drop
                    </option>

                    <option value="mirror">
                        Mirror
                    </option>

                </select>

            </div>


            <div class="fabric-control">

                <label>

                    <span>
                        📐 Pattern Scale
                    </span>

                    <span id="patternScaleValue">
                        35
                    </span>

                </label>

                <input
                    type="range"
                    id="patternScale"
                    min="10"
                    max="100"
                    value="35"
                >

            </div>


            <!-- HIJAB PREVIEW -->

            <div class="fabric-control">

                <div
                    style="
                        width:100%;
                        aspect-ratio:1/1;
                        border-radius:16px;
                        overflow:hidden;
                        border:1px solid #e5e0f3;
                        position:relative;
                        background:#eee9df;
                    "
                >

                    <canvas
                        id="hijabPreviewCanvas"
                        width="500"
                        height="500"
                        style="
                            width:100%;
                            height:100%;
                            display:block
                        "
                    ></canvas>


                    <span
                        style="
                            position:absolute;
                            right:8px;
                            bottom:8px;
                            background:
                                rgba(255,255,255,.82);
                            border-radius:8px;
                            padding:4px 7px;
                            font-size:10px;
                            font-weight:700;
                        "
                    >
                        150 × 150 cm
                    </span>

                </div>

            </div>


            <button
                class="fabric-mode-btn"
                onclick="toggleRealisticFabric()"
            >
                ✨ Realistic Fabric View
            </button>


        </section>


        <!-- COLOR -->

        <section class="panel-section">

            <div class="panel-title">
                🎨 Colors
            </div>


            <div
                class="palette"
                id="palette"
            ></div>


            <div
                style="
                    margin-top:10px;
                    display:flex;
                    gap:8px;
                    align-items:center;
                "
            >

                <input
                    type="color"
                    id="customColor"
                    value="#8b7cf6"
                    style="
                        width:45px;
                        height:38px;
                        border:0;
                        padding:0;
                    "
                >

                <span
                    style="
                        font-size:11px;
                        color:var(--muted);
                    "
                >
                    Custom Color
                </span>

            </div>

        </section>


        <!-- BRUSH -->

        <section class="panel-section">

            <div class="panel-title">
                🖌️ Brush Library
            </div>


            <div class="brush-grid">


                <div
                    class="brush-card active"
                    onclick="setBrush('pencil',this)"
                >
                    ✏️
                    <br>
                    Pencil
                </div>


                <div
                    class="brush-card"
                    onclick="setBrush('ink',this)"
                >
                    🖋️
                    <br>
                    Ink
                </div>


                <div
                    class="brush-card"
                    onclick="setBrush('marker',this)"
                >
                    🖍️
                    <br>
                    Marker
                </div>


                <div
                    class="brush-card"
                    onclick="setBrush('watercolor',this)"
                >
                    💧
                    <br>
                    Water
                </div>


                <div
                    class="brush-card"
                    onclick="setBrush('neon',this)"
                >
                    🌈
                    <br>
                    Neon
                </div>


                <div
                    class="brush-card"
                    onclick="setBrush('spray',this)"
                >
                    ✨
                    <br>
                    Spray
                </div>


            </div>

        </section>


        <!-- FONT STUDIO -->

        <section class="panel-section">

            <div class="panel-title">
                🔤 Font Studio
            </div>


            <textarea
                id="textInput"
                class="text-input"
                placeholder="اكتبي النص هنا / Type text here..."
            ></textarea>


            <div style="height:8px"></div>


            <select
                id="fontSelect"
                class="font-select"
            >

                <option value="Arial">
                    Arial
                </option>

                <option value="Georgia">
                    Georgia
                </option>

                <option value="Times New Roman">
                    Times New Roman
                </option>

                <option value="Courier New">
                    Courier New
                </option>

                <option value="Impact">
                    Impact
                </option>

/* =========================================================
   PATTERN
========================================================= */

function drawPattern(
    c,
    w,
    h
){

    const s =
        Math.max(
            10,
            patternScale
        );

    c.save();

    c.globalAlpha =
        .10 +
        fabricTexture*.18;

    c.strokeStyle =
        "#665b72";

    c.lineWidth = 1;


    if(
        patternType === "grid"
    ){

        for(
            let x=0;
            x<w;
            x+=s
        ){

            c.beginPath();

            c.moveTo(x,0);

            c.lineTo(x,h);

            c.stroke();

        }


        for(
            let y=0;
            y<h;
            y+=s
        ){

            c.beginPath();

            c.moveTo(0,y);

            c.lineTo(w,y);

            c.stroke();

        }

    }


    else if(
        patternType === "brick"
    ){

        for(
            let y=0;
            y<h;
            y+=s
        ){

            const off =
                (Math.floor(y/s)%2)
                *s/2;

            c.beginPath();

            c.moveTo(0,y);

            c.lineTo(w,y);

            c.stroke();


            for(
                let x=-s;
                x<w+s;
                x+=s
            ){

                c.beginPath();

                c.moveTo(
                    x+off,
                    y
                );

                c.lineTo(
                    x+off,
                    y+s
                );

                c.stroke();

            }

        }

    }


    else if(
        patternType === "halfdrop"
    ){

        for(
            let y=0;
            y<h;
            y+=s
        ){

            const off =
                (Math.floor(y/s)%2)
                *s/2;


            for(
                let x=-s;
                x<w+s;
                x+=s
            ){

                c.beginPath();

                c.arc(
                    x+off,
                    y,
                    s*.28,
                    0,
                    Math.PI*2
                );

                c.stroke();

            }

        }

    }


    else if(
        patternType === "mirror"
    ){

        for(
            let y=0;
            y<h;
            y+=s
        ){

            for(
                let x=0;
                x<w;
                x+=s
            ){

                c.save();

                c.translate(
                    x+s/2,
                    y+s/2
                );

                c.rotate(
                    Math.PI/4
                );

                c.strokeRect(
                    -s*.22,
                    -s*.22,
                    s*.44,
                    s*.44
                );

                c.restore();

            }

        }

    }


    c.restore();

}


/* =========================================================

function drawHijabPreview(){

    const hCanvas =
        document.getElementById(
            "hijabPreviewCanvas"
        );

    if(!hCanvas){
        return;
    }


    const hc =
        hCanvas.getContext("2d");


    const settings =
        fabricSettings[
            currentFabric
        ];


    hc.clearRect(
        0,
        0,
        hCanvas.width,
        hCanvas.height
    );


    hc.fillStyle =
        settings.base;

    hc.fillRect(
        0,
        0,
        hCanvas.width,
        hCanvas.height
    );


    drawPattern(
        hc,
        hCanvas.width,
        hCanvas.height
    );


    if(
        realisticFabric
    ){

        const texture =
            hc.createRadialGradient(
                250,
                250,
                20,
                250,
                250,
                350
            );

        texture.addColorStop(
            0,
            "rgba(255,255,255,.22)"
        );

        texture.addColorStop(
            1,
            "rgba(0,0,0,.10)"
        );

        hc.fillStyle =
            texture;

        hc.fillRect(
            0,
            0,
            hCanvas.width,
            hCanvas.height
        );

    }


    if(
        currentFabric === "satin" ||
        currentFabric === "silk"
    ){

        const shine =
            hc.createLinearGradient(
                0,
                0,
                hCanvas.width,
                hCanvas.height
            );


        shine.addColorStop(
            0,
            "rgba(255,255,255,0)"
        );


        shine.addColorStop(
            .48,
            `rgba(
                255,
                255,
                255,
                ${.45*fabricShine}
            )`
        );


        shine.addColorStop(
            .55,
            "rgba(255,255,255,0)"
        );


        shine.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );


        hc.fillStyle =
            shine;

        hc.fillRect(
            0,
            0,
            hCanvas.width,
            hCanvas.height
        );

    }


    hc.strokeStyle =
        "rgba(255,255,255,.5)";

    hc.lineWidth = 5;

    hc.strokeRect(
        5,
        5,
        hCanvas.width-10,
        hCanvas.height-10
    );

}


/* =========================================================

function drawFabricSurface(){

    if(!fabricMode){
        return;
    }


    const settings =
        fabricSettings[
            currentFabric

    ctx.save();


    ctx.globalAlpha = 1;

    ctx.fillStyle =
        settings.base;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawPattern(
        ctx,
        canvas.width,
        canvas.height
    );


    const count =
        Math.floor(
            300 +
            fabricTexture*800
        );


    ctx.globalAlpha =
        settings.opacity;


    ctx.strokeStyle =
        settings.thread;


    ctx.lineWidth = .5;


    for(
        let i=0;
        i<count;
        i++
    ){

        const x =
            Math.random()
            *canvas.width;

        const y =
            Math.random()
            *canvas.height;


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x + 20,
            y + 2
        );

        ctx.stroke();

    }


    if(
        realisticFabric &&
        (
            currentFabric === "satin" ||
            currentFabric === "silk"
        )
    ){

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                canvas.width,
                canvas.height
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,0)"
        );


        gradient.addColorStop(
            .48,
            `rgba(
                255,
                255,
                255,
                ${.32*fabricShine}
            )`
        );


        gradient.addColorStop(
            .55,
            "rgba(255,255,255,0)"
        );


        gradient.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );


        ctx.globalAlpha = 1;

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    ctx.restore();

}

/* =========================================================

function drawStroke(
    c,
    obj
){

    if(!obj.points || !obj.points.length){
        return;
    }


    c.save();


    c.globalAlpha =
        obj.opacity;


    c.lineCap =
        "round";

    c.lineJoin =
        "round";


    c.strokeStyle =
        obj.color;


    c.lineWidth =
        obj.size;


    if(
        obj.brush === "ink"
    ){

        c.lineWidth =
            obj.size*1.25;

    }


    if(
        obj.brush === "marker"
    ){

        c.lineWidth =
            obj.size*2;

        c.globalAlpha =
            obj.opacity*.65;

    }


    if(
        obj.brush === "watercolor"
    ){

        c.lineWidth =
            obj.size*2;

        c.globalAlpha =
            obj.opacity*.22;

    }


    if(
        obj.brush === "neon"
    ){

        c.shadowBlur = 14;

        c.shadowColor =
            obj.color;

    }


    if(
        obj.brush === "spray"
    ){

        drawSpray(
            c,
            obj
        );

        c.restore();

        return;

    }


    c.beginPath();


    c.moveTo(
        obj.points[0].x,
        obj.points[0].y
    );


    for(
        let i=1;
        i<obj.points.length;
        i++
    ){

        c.lineTo(
            obj.points[i].x,
            obj.points[i].y
        );

    }


    c.stroke();


    c.restore();

}


function drawSpray(
    c,
    obj
){

    const amount =
        Math.max(
            40,
            obj.size*10
        );


    c.fillStyle =
        obj.color;


    for(
        let i=0;
        i<amount;
        i++
    ){

        const p =
            obj.points[
                Math.floor(
                    Math.random()
                    *obj.points.length
                )
            ];


        const angle =
            Math.random()
            *Math.PI*2;


        const radius =
            Math.random()
            *obj.size*2;


        const x =
            p.x +
            Math.cos(angle)*radius;


        const y =
            p.y +
            Math.sin(angle)*radius;


        c.globalAlpha =
            Math.random()
            *.4*
            obj.opacity;


        c.fillRect(
            x,
            y,
            1.5,
            1.5
        );

    }

}


function drawLine(
    c,
    obj
){

    c.save();

    c.globalAlpha =
        obj.opacity;

    c.strokeStyle =
        obj.color;

    c.lineWidth =
        obj.size;

    c.lineCap =
        "round";

    c.beginPath();

    c.moveTo(
        obj.x1,
        obj.y1
    );

    c.lineTo(
        obj.x2,
        obj.y2
    );

    c.stroke();

    c.restore();

}


function drawRect(
    c,
    obj
){

    c.save();

    c.globalAlpha =
        obj.opacity;

    c.strokeStyle =
        obj.color;

    c.lineWidth =
        obj.size;

    c.strokeRect(
        obj.x,
        obj.y,
        obj.w,
        obj.h
    );

    c.restore();

}


function drawCircle(
    c,
    obj
){

    c.save();

    c.globalAlpha =
        obj.opacity;

    c.strokeStyle =
        obj.color;

    c.lineWidth =
        obj.size;

    c.beginPath();

    c.ellipse(
        obj.cx,
        obj.cy,
        Math.abs(obj.rx),
        Math.abs(obj.ry),
        0,
        0,
        Math.PI*2
    );

    c.stroke();

    c.restore();

}


function drawText(
    c,
    obj
){

    c.save();

    c.globalAlpha =
        obj.opacity;

    c.fillStyle =
        obj.color;

    c.font =
        `${obj.size}px ${obj.font}`;

    c.textBaseline =
        "top";

    c.direction =
        /[\u0600-\u06FF]/.test(
            obj.text
        )
        ? "rtl"
        : "ltr";


    c.fillText(
        obj.text,
        obj.x,
        obj.y
    );


    c.restore();

}


function drawImageObject(
    c,
    obj
){

    if(!obj.img){
        return;
    }


    c.save();


    c.globalAlpha =
        obj.opacity;


    const cx =
        obj.x +
        obj.w/2;


    const cy =
        obj.y +
        obj.h/2;


    c.translate(
        cx,
        cy
    );


    c.rotate(
        obj.rotation || 0
    );


    c.drawImage(
        obj.img,
        -obj.w/2,
        -obj.h/2,
        obj.w,
        obj.h
    );


    c.restore();

}


/* =========================================================
   BOUNDS
========================================================= */

function getBounds(obj){

    if(obj.type === "stroke"){

        const xs =
            obj.points.map(
                p=>p.x
            );

        const ys =
            obj.points.map(
                p=>p.y
            );


        const minX =
            Math.min(...xs);

        const maxX =
            Math.max(...xs);

        const minY =
            Math.min(...ys);

        const maxY =
            Math.max(...ys);


        return {

            x:minX,
            y:minY,
            w:maxX-minX || 1,
            h:maxY-minY || 1

        };

    }


    if(obj.type === "line"){

        return {

            x:Math.min(
                obj.x1,
                obj.x2
            ),

            y:Math.min(
                obj.y1,
                obj.y2
            ),

            w:Math.abs(
                obj.x2-obj.x1
            ),

            h:Math.abs(
                obj.y2-obj.y1
            )

        };

    }


    if(obj.type === "rect"){

        return {

            x:obj.x,
            y:obj.y,
            w:obj.w,
            h:obj.h

        };

    }


    if(obj.type === "circle"){

        return {

            x:
                obj.cx -
                obj.rx,

            y:
                obj.cy -
                obj.ry,

            w:
                obj.rx*2,

            h:
                obj.ry*2

        };

    }


    if(
        obj.type === "text"
    ){

        const width =
            ctx.measureText(
                obj.text
            ).width;


        return {

            x:obj.x,
            y:obj.y,
            w:width,
            h:obj.size*1.2

        };

    }


    if(
        obj.type === "image"
    ){

        return {

            x:obj.x,
            y:obj.y,
            w:obj.w,
            h:obj.h

        };

    }


    return {
        x:0,
        y:0,
        w:0,
        h:0
    };

}


/* =========================================================
   SELECTION
========================================================= */

function drawSelection(obj){

    const b =
        getBounds(obj);


    ctx.save();


    ctx.strokeStyle =
        "#7d6df0";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        6,
        5
    ]);


    ctx.strokeRect(
        b.x-5,
        b.y-5,
        b.w+10,
        b.h+10
    );


    ctx.setLineDash([]);


    ctx.fillStyle =
        "#7d6df0";


    ctx.beginPath();

    ctx.arc(
        b.x+b.w+6,
        b.y+b.h+6,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(fabricMode){

        drawFabricSurface();

    }else{

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    objects.forEach(
        obj=>{

            if(
                obj.visible === false
            ){
                return;
            }


            if(
                obj.type === "stroke"
            ){

                drawStroke(
                    ctx,
                    obj
                );

            }


            else if(
                obj.type === "line"
            ){

                drawLine(
                    ctx,
                    obj
                );

            }


            else if(
                obj.type === "rect"
            ){

                drawRect(
                    ctx,
                    obj
                );

            }


            else if(
                obj.type === "circle"
            ){

                drawCircle(
                    ctx,
                    obj
                );

            }


            else if(
                obj.type === "text"
            ){

                drawText(
                    ctx,
                    obj
                );

            }


            else if(
                obj.type === "image"
            ){

                drawImageObject(
                    ctx,
                    obj
                );

            }

        }
    );


    if(
        currentTool === "select" &&
        selectedId
    ){

        const obj =
            getSelected();


        if(obj){

            drawSelection(
                obj
            );

        }

    }

}


/* =========================================================
   HIT TEST
========================================================= */

function hitTest(
    x,
    y
){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const obj =
            objects[i];


        const b =
            getBounds(obj);


        const padding = 8;


        if(
            x >= b.x-padding &&
            x <= b.x+b.w+padding &&
            y >= b.y-padding &&
            y <= b.y+b.h+padding
        ){

            return obj;

        }

    }


    return null;

}


/* =========================================================
   POINTER POSITION
========================================================= */

function getPointerPosition(e){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (e.clientX-rect.left)
            *
            canvas.width/
            rect.width,

        y:
            (e.clientY-rect.top)
            *
            canvas.height/
            rect.height

    };

}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e=>{

        canvas.setPointerCapture(
            e.pointerId
        );


        const p =
            getPointerPosition(e);


        pointerStart = {
            x:p.x,
            y:p.y
        };


        startX =
            p.x;

        startY =
            p.y;


        drawing = true;


        if(
            currentTool === "select"
        ){

            const current =
                getSelected();


            if(
                current &&
                isOnResizeHandle(
                    p.x,
                    p.y,
                    current
                )
            ){

                resizing = true;

                resizeStart = {
                    x:p.x,
                    y:p.y
                };


                resizeOriginal = {

                    w:current.w,
                    h:current.h,

                    rx:current.rx,
                    ry:current.ry,

                    size:current.size

                };


                saveHistory();

                render();

                return;

            }


            const obj =
                hitTest(
                    p.x,
                    p.y
                );


            selectedId =
                obj
                    ? obj.id
                    : null;


            if(obj){

                dragOffset = {

                    x:p.x,
                    y:p.y

                };


                saveHistory();

            }


            render();

            updateLayers();

            return;

        }


        if(
            currentTool === "picker"
        ){

            pickColor(
                p.x,
                p.y
            );

            drawing = false;

            return;

        }


        if(
            currentTool === "fill"
        ){

            fillAt(
                p.x,
                p.y
            );

            drawing = false;

            return;

        }


        if(
            currentTool === "text"
        ){

            createText(
                p.x,
                p.y
            );

            drawing = false;

            return;

        }


        saveHistory();


        if(
            currentTool === "brush" ||
            currentTool === "eraser"
        ){

            currentObject = {

                id:uid(),

                type:"stroke",

                points:[
                    {
                        x:p.x,
                        y:p.y
                    }
                ],

                color:
                    currentTool === "eraser"
                    ? "#ffffff"
                    : currentColor,

                size:
                    currentTool === "eraser"
                    ? brushSize*2
                    : brushSize,

                opacity:
                    brushOpacity,

                brush:
                    currentTool === "eraser"
                    ? "marker"
                    : brushType,

                visible:true

            };


            objects.push(
                currentObject
            );

        }


        else if(
            currentTool === "line"
        ){

            currentObject = {

                id:uid(),

                type:"line",

                x1:p.x,
                y1:p.y,

                x2:p.x,
                y2:p.y,

                color:currentColor,

                size:brushSize,

                opacity:brushOpacity,

                visible:true

            };


            objects.push(
                currentObject
            );

        }


        else if(
            currentTool === "rect"
        ){

            currentObject = {

                id:uid(),

                type:"rect",

                x:p.x,
                y:p.y,

                w:1,
                h:1,

                color:currentColor,

                size:brushSize,

                opacity:brushOpacity,

                visible:true

            };


            objects.push(
                currentObject
            );

        }


        else if(
            currentTool === "circle"
        ){

            currentObject = {

                id:uid(),

                type:"circle",

                cx:p.x,

                cy:p.y,

                rx:1,

                ry:1,

                color:currentColor,

                size:brushSize,

                opacity:brushOpacity,

                visible:true

            };


            objects.push(
                currentObject
            );

        }


        render();

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    e=>{

        if(!drawing){
            return;
        }


        const p =
            getPointerPosition(e);


        if(
            currentTool === "select"
        ){

            if(
                resizing &&
                selectedId &&
                resizeStart &&
                resizeOriginal
            ){

                const obj =
                    getSelected();


                if(obj){

                    resizeObject(
                        obj,
                        p.x -
                        resizeStart.x,

                        p.y -
                        resizeStart.y
                    );


                    render();

                }


                return;

            }


            if(
                selectedId &&
                pointerStart
            ){

                const obj =
                    getSelected();


                if(obj){

                    const dx =
                        p.x -
                        pointerStart.x;


                    const dy =
                        p.y -
                        pointerStart.y;


                    moveObject(
                        obj,
                        dx,
                        dy
                    );


                    pointerStart =
                        p;


                    render();

                }

            }


            return;

        }


        if(
            currentTool === "brush" ||
            currentTool === "eraser"
        ){

            if(
                currentObject
            ){

                currentObject.points.push({

                    x:p.x,
                    y:p.y

                });


                render();

            }


            return;

        }


        if(
            currentTool === "line"
        ){

            if(currentObject){

                currentObject.x2 =
                    p.x;

                currentObject.y2 =
                    p.y;

                render();

            }

            return;

        }


        if(
            currentTool === "rect"
        ){

            if(currentObject){

                currentObject.w =
                    p.x -
                    startX;

                currentObject.h =
                    p.y -
                    startY;

                render();

            }

            return;

        }


        if(
            currentTool === "circle"
        ){

            if(currentObject){

                currentObject.rx =
                    Math.abs(
                        p.x-startX
                    );

                currentObject.ry =
                    Math.abs(
                        p.y-startY
                    );

                render();

            }

        }

    }
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    e=>{

        drawing = false;

        currentObject = null;

        pointerStart = null;

        dragOffset = null;

        resizing = false;

        resizeStart = null;

        resizeOriginal = null;

        render();

        updateLayers();

    }
);


/* =========================================================
   POINTER CANCEL
========================================================= */

canvas.addEventListener(
    "pointercancel",
    e=>{

        drawing = false;

        currentObject = null;

        pointerStart = null;

        dragOffset = null;

        resizing = false;

        resizeStart = null;

        resizeOriginal = null;

        render();

    }
);


/* =========================================================
   MOVE OBJECT
========================================================= */

function moveObject(
    obj,
    dx,
    dy
){

    if(
        obj.type === "stroke"
    ){

        obj.points.forEach(
            p=>{

                p.x += dx;
                p.y += dy;

            }
        );

    }


    else if(
        obj.type === "line"
    ){

        obj.x1 += dx;
        obj.y1 += dy;

        obj.x2 += dx;
        obj.y2 += dy;

    }


    else if(
        obj.type === "rect"
    ){

        obj.x += dx;
        obj.y += dy;

    }


    else if(
        obj.type === "circle"
    ){

        obj.cx += dx;
        obj.cy += dy;

    }


    else if(
        obj.type === "text"
    ){

        obj.x += dx;
        obj.y += dy;

    }


    else if(
        obj.type === "image"
    ){

        obj.x += dx;
        obj.y += dy;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function isOnResizeHandle(
    x,
    y,
    obj
){

    const b =
        getBounds(obj);


    const hx =
        b.x+b.w+6;


    const hy =
        b.y+b.h+6;


    return (
        Math.abs(x-hx)<=14 &&
        Math.abs(y-hy)<=14
    );

}


function resizeObject(
    obj,
    dx,
    dy
){

    if(
        obj.type === "rect"
    ){

        obj.w =
            Math.max(
                5,
                resizeOriginal.w+dx
            );


        obj.h =
            Math.max(
                5,
                resizeOriginal.h+dy
            );

    }


    else if(
        obj.type === "circle"
    ){

        obj.rx =
            Math.max(
                3,
                resizeOriginal.rx+dx
            );


        obj.ry =
            Math.max(
                3,
                resizeOriginal.ry+dy
            );

    }


    else if(
        obj.type === "image"
    ){

        obj.w =
            Math.max(
                20,
                resizeOriginal.w+dx
            );


        obj.h =
            Math.max(
                20,
                resizeOriginal.h+dy
            );

    }


    else if(
        obj.type === "text"
    ){

        obj.size =
            Math.max(
                8,
                resizeOriginal.size+dy
            );

    }

}


/* =========================================================
   TEXT
========================================================= */

function createText(
    x,
    y
){

    const input =
        document.getElementById(
            "textInput"
        );


    let text =
        input.value.trim();


    if(!text){

        text =
            prompt(
                "Enter text / اكتب النص:"
            );

    }


    if(!text){
        return;
    }


    saveHistory();


    objects.push({

        id:uid(),

        type:"text",

        text:text,

        x:x,

        y:y,

        size:
            Math.max(
                12,
                brushSize*4
            ),

        font:
            fontSelect.value,

        color:
            currentColor,

        opacity:
            brushOpacity,

        visible:true

    });


    render();

    updateLayers();

}


/* =========================================================
   PICK COLOR
========================================================= */

function pickColor(
    x,
    y
){

    render();


    const pixel =
        ctx.getImageData(
            Math.floor(x),
            Math.floor(y),
            1,
            1
        ).data;


    const hex =
        "#" +
        [pixel[0],pixel[1],pixel[2]]
            .map(
                n=>
                    n.toString(16)
                     .padStart(2,"0")
            )
            .join("");


    setColor(hex);

}


/* =========================================================
   FILL
========================================================= */

function fillAt(
    x,
    y
){

    render();


    const w =
        canvas.width;


    const h =
        canvas.height;


    const source =
        ctx.getImageData(
            0,
            0,
            w,
            h
        );


    const data =
        source.data;


    const px =
        Math.floor(x);


    const py =
        Math.floor(y);


    if(
        px<0 ||
        py<0 ||
        px>=w ||
        py>=h
    ){

        return;

    }


    const startIndex =
        (py*w+px)*4;


    const target = [

        data[startIndex],

        data[startIndex+1],

        data[startIndex+2],

        data[startIndex+3]

    ];


    const fill =
        hexToRGBA(
            currentColor
        );


    if(
        colorsClose(
            target[0],
            target[1],
            target[2],
            target[3],

            fill.r,
            fill.g,
            fill.b,
            255
        )
    ){

        return;

    }


    const mask =
        document.createElement(
            "canvas"
        );


    mask.width = w;

    mask.height = h;


    const mctx =
        mask.getContext("2d");


    const output =
        mctx.createImageData(
            w,
            h
        );


    const out =
        output.data;


    const stack = [
        [px,py]
    ];


    const seen =
        new Uint8Array(
            w*h
        );


    const tolerance = 25;


    while(
        stack.length
    ){

        const [
            cx,
            cy
        ] =
            stack.pop();


        if(
            cx<0 ||
            cy<0 ||
            cx>=w ||
            cy>=h
        ){

            continue;

        }


        const pos =
            cy*w+cx;


        if(seen[pos]){
            continue;
        }


        seen[pos] = 1;


        const i =
            pos*4;


        if(
            Math.abs(
                data[i]-target[0]
            )>tolerance ||

            Math.abs(
                data[i+1]-target[1]
            )>tolerance ||

            Math.abs(
                data[i+2]-target[2]
            )>tolerance ||

            Math.abs(
                data[i+3]-target[3]
            )>tolerance
        ){

            continue;

        }


        out[i] =
            fill.r;

        out[i+1] =
            fill.g;

        out[i+2] =
            fill.b;

        out[i+3] =
            255;


        stack.push(
            [cx+1,cy],
            [cx-1,cy],
            [cx,cy+1],
            [cx,cy-1]
        );

    }


    mctx.putImageData(
        output,
        0,
        0
    );


    const dataUrl =
        mask.toDataURL(
            "image/png"
        );


    saveHistory();


    const obj = {

        id:uid(),

        type:"image",

        x:0,

        y:0,

        w:w,

        h:h,

        rotation:0,

        imageSrc:dataUrl,

        opacity:1,

        visible:true,

        isFillLayer:true

    };


    const img =
        new Image();


    img.onload =
        ()=>{

            obj.img =
                img;


            objects.push(
                obj
            );


            selectedId =
                null;


            render();

            updateLayers();

        };


    img.src =
        dataUrl;

}


/* =========================================================
   COLOR HELPERS
========================================================= */

function hexToRGBA(
    hex
){

    hex =
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(0,2),
                16
            ),

        g:
            parseInt(
                hex.substring(2,4),
                16
            ),

        b:
            parseInt(
                hex.substring(4,6),
                16
            )

    };

}


function colorsClose(
    r1,
    g1,
    b1,
    a1,

    r2,
    g2,
    b2,
    a2
){

    const tolerance =
        25;


    return (
        Math.abs(r1-r2)<=tolerance &&
        Math.abs(g1-g2)<=tolerance &&
        Math.abs(b1-b2)<=tolerance &&
        Math.abs(a1-a2)<=tolerance
    );

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadImage(
    event
){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        e=>{

            saveHistory();


            const img =
                new Image();


            img.onload =
                ()=>{

                    const max =
                        400;


                    let w =
                        img.width;


                    let h =
                        img.height;


                    if(
                        w>max ||
                        h>max
                    ){

                        const scale =
                            Math.min(
                                max/w,
                                max/h
                            );


                        w *= scale;

                        h *= scale;

                    }


                    const obj = {

                        id:uid(),

                        type:"image",

                        x:
                            (
                                canvas.width-w
                            )/2,

                        y:
                            (
                                canvas.height-h
                            )/2,

                        w:w,

                        h:h,

                        rotation:0,

                        imageSrc:
                            e.target.result,

                        img:img,

                        opacity:1,

                        visible:true

                    };


                    objects.push(
                        obj
                    );


                    selectedId =
                        obj.id;


                    render();

                    updateLayers();

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   SERIALIZE
========================================================= */

function serialize(){

    return JSON.stringify(
        objects.map(
            obj=>{

                const copy =
                    {
                        ...obj
                    };


                delete copy.img;


                return copy;

            }
        )
    );

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory(){

    const state =
        serialize();


    history =
        history.slice(
            0,
            historyIndex+1
        );


    history.push(
        state
    );


    historyIndex =
        history.length-1;


    if(
        history.length>50
    ){

        history.shift();

        historyIndex--;

    }

}


/* =========================================================
   RESTORE
========================================================= */

function restoreState(
    state
){

    const parsed =
        JSON.parse(
            state
        );


    objects =
        [];


    let pending =
        parsed.length;


    if(!pending){

        render();

        updateLayers();

        return;

    }


    parsed.forEach(
        obj=>{

            if(
                obj.type === "image" &&
                obj.imageSrc
            ){

                const img =
                    new Image();


                img.onload =
                    ()=>{

                        obj.img =
                            img;


                        objects.push(
                            obj
                        );


                        pending--;

                        if(
                            pending === 0
                        ){

                            render();

                            updateLayers();

                        }

                    };


                img.src =
                    obj.imageSrc;

            }else{

                objects.push(
                    obj
                );


                pending--;

            }

        }
    );


    if(
        pending === 0
    ){

        render();

        updateLayers();

    }

}


/* =========================================================
   UNDO
========================================================= */

function undo(){

    if(
        historyIndex<=0
    ){

        return;

    }


    historyIndex--;


    restoreState(
        history[
            historyIndex
        ]
    );

}


/* =========================================================
   REDO
========================================================= */

function redo(){

    if(
        historyIndex>=
        history.length-1
    ){

        return;

    }


    historyIndex++;


    restoreState(
        history[
            historyIndex
        ]
    );

}


/* =========================================================
   LAYERS
========================================================= */

function updateLayers(){

    const container =
        document.getElementById(
            "layers"
        );


    container.innerHTML =
        "";


    [...objects]
        .reverse()
        .forEach(
            (obj,index)=>{

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "layer";


                if(
                    obj.id === selectedId
                ){

                    item.classList.add(
                        "selected"
                    );

                }


                let name =
                    obj.type;


                if(
                    obj.type === "text"
                ){

                    name =
                        "T: " +
                        obj.text;

                }


                if(
                    obj.isFillLayer
                ){

                    name =
                        "🪣 Fill";

                }


                item.innerHTML = `

                    <span>
                        ${obj.visible===false
                            ? "🙈"
                            : "👁️"}
                    </span>

                    <span class="layer-name">
                        ${name}
                    </span>

                `;


                item.onclick =
                    ()=>{

                        selectedId =
                            obj.id;

                        setTool(
                            "select"
                        );

                        render();

                        updateLayers();

                    };


                container.appendChild(
                    item
                );

            }
        );

}


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSelected(){

    const obj =
        getSelected();


    if(!obj){
        return;
    }


    saveHistory();


    const copy =
        JSON.parse(
            JSON.stringify(
                serializeObject(
                    obj
                )
            )
        );


    copy.id =
        uid();


    copy.x =
        (copy.x || 0)+20;


    copy.y =
        (copy.y || 0)+20;


    if(
        copy.type === "image" &&
        copy.imageSrc
    ){

        const img =
            new Image();


        img.onload =
            ()=>{

                copy.img =
                    img;

                objects.push(
                    copy
                );

                selectedId =
                    copy.id;

                render();

                updateLayers();

            };


        img.src =
            copy.imageSrc;


    }else{

        objects.push(
            copy
        );


        selectedId =
            copy.id;


        render();

        updateLayers();

    }

}


function serializeObject(
    obj
){

    const copy =
        {
            ...obj
        };


    delete copy.img;


    return copy;

}


/* =========================================================
   DELETE
========================================================= */

function deleteSelected(){

    if(!selectedId){
        return;
    }


    saveHistory();


    objects =
        objects.filter(
            o=>
                o.id !== selectedId
        );


    selectedId =
        null;


    render();

    updateLayers();

}


/* =========================================================
   MOVE LAYER UP
========================================================= */

function moveLayerUp(){

    const index =
        objects.findIndex(
            o=>
                o.id === selectedId
        );


    if(
        index < 0 ||
        index >= objects.length-1
    ){

        return;

    }


    saveHistory();


    [
        objects[index],
        objects[index+1]
    ] =
    [
        objects[index+1],
        objects[index]
    ];


    render();

    updateLayers();

}


/* =========================================================
   MOVE LAYER DOWN
========================================================= */

function moveLayerDown(){

    const index =
        objects.findIndex(
            o=>
                o.id === selectedId
        );


    if(index<=0){
        return;
    }


    saveHistory();


    [
        objects[index],
        objects[index-1]
    ] =
    [
        objects[index-1],
        objects[index]
    ];


    render();

    updateLayers();

}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas(){

    if(
        !confirm(
            "Clear the whole drawing?"
        )
    ){

        return;

    }


    saveHistory();


    objects =
        [];


    selectedId =
        null;


    render();

    updateLayers();

}


/* =========================================================
   NEW PROJECT
========================================================= */

function newProject(){

    if(
        objects.length &&
        !confirm(
            "Start a new project?"
        )
    ){

        return;

    }


    objects =
        [];


    selectedId =
        null;


    history =
        [];


    historyIndex =
        -1;


    render();

    saveHistory();

    updateLayers();

}


/* =========================================================
   EXPORT
========================================================= */

function exportPNG(){

    const old =
        selectedId;


    selectedId =
        null;


    render();


    const link =
        document.createElement(
            "a"
        );


    link.download =
        "drawlab-design.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();


    selectedId =
        old;


    render();

}


/* =========================================================
   ZOOM
========================================================= */

function updateZoom(){

    canvas.style.transform =
        `scale(${zoom})`;


    document.getElementById(
        "zoomValue"
    ).textContent =
        Math.round(
            zoom*100
        )+"%";

}


function changeZoom(
    amount
){

    zoom =
        clamp(
            zoom+amount,
            .5,
            2
        );


    updateZoom();

}


function resetZoom(){

    zoom = 1;

    updateZoom();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="z"
        ){

            e.preventDefault();

            undo();

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="y"
        ){

            e.preventDefault();

            redo();

        }


        if(
            e.key === "Delete"
        ){

            deleteSelected();

        }


        if(
            e.key.toLowerCase()==="v"
        ){

            setTool(
                "select"
            );

        }


        if(
            e.key.toLowerCase()==="b"
        ){

            setTool(
                "brush"
            );

        }


        if(
            e.key.toLowerCase()==="e"
        ){

            setTool(
                "eraser"
            );

        }


        if(
            e.key.toLowerCase()==="f"
        ){

            setTool(
                "fill"
            );

        }

    }
);


/* =========================================================
   INIT
========================================================= */

setColor(
    currentColor
);


updateZoom();


drawHijabPreview();


render();


saveHistory();


updateLayers();

</script>

</body>
</html>
