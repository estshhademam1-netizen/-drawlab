<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DrawLab V4</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f7f3ff;
    color:#302b3d;
    overflow:hidden;
}

button,
input{
    font:inherit;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:64px;
    background:linear-gradient(135deg,#ffb7d5,#cbb8ff);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 4px 15px rgba(100,70,150,.15);
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:white;
    text-shadow:0 2px 5px rgba(0,0,0,.15);
}

.logo span{
    font-size:12px;
    display:block;
    opacity:.9;
}

.header-actions{
    display:flex;
    gap:7px;
}

.header button{
    border:none;
    background:rgba(255,255,255,.8);
    color:#514567;
    border-radius:12px;
    padding:9px 12px;
    cursor:pointer;
    font-weight:bold;
}

.header button:hover{
    background:white;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    display:flex;
    min-height:0;
}

/* ================= TOOLBAR ================= */

.toolbar{
    width:75px;
    background:white;
    border-right:1px solid #eee;
    padding:10px 7px;
    display:flex;
    flex-direction:column;
    gap:7px;
    overflow-y:auto;
}

.tool{
    border:none;
    background:#faf8ff;
    color:#514567;
    border-radius:13px;
    min-height:53px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.tool .icon{
    font-size:21px;
}

.tool.active{
    background:linear-gradient(135deg,#ffb5d4,#bda9ff);
    color:white;
    box-shadow:0 4px 10px rgba(150,100,200,.25);
}

/* ================= WORKSPACE ================= */

.workspace{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,190,220,.25),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(190,180,255,.25),transparent 30%),
        #f1eef7;
    overflow:hidden;
    position:relative;
}

.canvas-wrap{
    position:relative;
    transform-origin:center center;
    box-shadow:0 15px 40px rgba(60,40,90,.2);
}

#canvas{
    display:block;
    background:white;
    touch-action:none;
    cursor:crosshair;
}

.zoom-box{
    position:absolute;
    bottom:15px;
    left:15px;
    background:rgba(255,255,255,.9);
    border-radius:15px;
    padding:7px;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.zoom-box button{
    width:30px;
    height:30px;
    border:none;
    border-radius:9px;
    background:#eee8ff;
    cursor:pointer;
}

#zoomLabel{
    width:50px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

/* ================= SIDE PANEL ================= */

.panel{
    width:255px;
    background:white;
    border-left:1px solid #eee;
    padding:14px;
    overflow-y:auto;
}

.panel-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:12px;
}

.section{
    background:#faf9ff;
    border-radius:16px;
    padding:12px;
    margin-bottom:12px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:9px;
}

.row:last-child{
    margin-bottom:0;
}

label{
    font-size:12px;
    color:#655b75;
}

input[type="range"]{
    width:120px;
}

input[type="color"]{
    width:42px;
    height:32px;
    border:none;
    padding:0;
    background:none;
}

.small-btn{
    border:none;
    background:#eee8ff;
    border-radius:9px;
    padding:7px 9px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.small-btn:hover{
    background:#ded4ff;
}

/* ================= LAYERS ================= */

.layers{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.layer{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
    background:white;
    border:1px solid #eee;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
}

.layer.selected{
    background:#eee7ff;
    border-color:#c1aaff;
}

.layer-icon{
    font-size:17px;
}

.layer-name{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.layer-actions{
    display:flex;
    gap:3px;
}

.layer-actions button{
    border:none;
    background:transparent;
    cursor:pointer;
    padding:3px;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .header{
        height:55px;
        padding:0 10px;
    }

    .logo{
        font-size:18px;
    }

    .header button{
        padding:7px 9px;
        font-size:11px;
    }

    .toolbar{
        position:absolute;
        z-index:20;
        bottom:0;
        left:0;
        right:0;
        width:100%;
        height:70px;
        flex-direction:row;
        padding:6px;
        border-top:1px solid #eee;
        border-right:none;
        overflow-x:auto;
        overflow-y:hidden;
    }

    .tool{
        min-width:60px;
        min-height:57px;
    }

    .panel{
        position:absolute;
        z-index:30;
        right:0;
        top:55px;
        bottom:70px;
        width:250px;
        transform:translateX(100%);
        transition:.25s;
        box-shadow:-5px 0 20px rgba(0,0,0,.12);
    }

    .panel.open{
        transform:translateX(0);
    }

    .workspace{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        ✨ DrawLab
        <span>Creative Studio V4</span>
    </div>

    <div class="header-actions">
        <button onclick="newProject()">＋ New</button>
        <button onclick="uploadImage()">🖼️</button>
        <button onclick="exportPNG()">💾</button>
        <button onclick="togglePanel()">☰</button>
    </div>

</header>

<div class="main">

<!-- TOOLBAR -->

<div class="toolbar">

    <button class="tool active" data-tool="select">
        <span class="icon">🖱️</span>
        Select
    </button>

    <button class="tool" data-tool="brush">
        <span class="icon">🖌️</span>
        Brush
    </button>

    <button class="tool" data-tool="eraser">
        <span class="icon">🧹</span>
        Eraser
    </button>

    <button class="tool" data-tool="line">
        <span class="icon">╱</span>
        Line
    </button>

    <button class="tool" data-tool="rect">
        <span class="icon">▢</span>
        Square
    </button>

    <button class="tool" data-tool="circle">
        <span class="icon">○</span>
        Circle
    </button>

    <button class="tool" data-tool="text">
        <span class="icon">T</span>
        Text
    </button>

    <button class="tool" data-tool="image">
        <span class="icon">🌄</span>
        Image
    </button>

</div>

<!-- WORKSPACE -->

<div class="workspace" id="workspace">

    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"
                width="900"
                height="550"></canvas>
    </div>

    <div class="zoom-box">

        <button onclick="zoomOut()">−</button>

        <span id="zoomLabel">100%</span>

        <button onclick="zoomIn()">+</button>

        <button onclick="resetZoom()">⟳</button>

    </div>

</div>

<!-- PANEL -->

<aside class="panel" id="panel">

    <div class="panel-title">
        🎨 DrawLab Studio
    </div>

    <div class="section">

        <div class="row">
            <label>Color</label>
            <input type="color" id="colorPicker" value="#6c4cff">
        </div>

        <div class="row">
            <label>Size</label>
            <input type="range"
                   id="size"
                   min="1"
                   max="80"
                   value="8">
        </div>

        <div class="row">
            <label>Opacity</label>
            <input type="range"
                   id="opacity"
                   min="0.05"
                   max="1"
                   step="0.05"
                   value="1">
        </div>

    </div>

    <div class="section">

        <div class="row">
            <label>Object</label>

            <div>
                <button class="small-btn"
                        onclick="duplicateSelected()">
                    Duplicate
                </button>

                <button class="small-btn"
                        onclick="deleteSelected()">
                    Delete
                </button>
            </div>
        </div>

        <div class="row">

            <button class="small-btn"
                    onclick="moveLayerUp()">
                ↑ Up
            </button>

            <button class="small-btn"
                    onclick="moveLayerDown()">
                ↓ Down
            </button>

        </div>

    </div>

    <div class="section">

        <div class="row">
            <button class="small-btn"
                    onclick="undo()">
                ↩ Undo
            </button>

            <button class="small-btn"
                    onclick="redo()">
                ↪ Redo
            </button>
        </div>

        <div class="row">

            <button class="small-btn"
                    onclick="clearCanvas()">
                🗑 Clear
            </button>

            <button class="small-btn"
                    onclick="exportPNG()">
                💾 PNG
            </button>

        </div>

    </div>

    <div class="panel-title">
        📚 Layers
    </div>

    <div class="layers" id="layers"></div>

</aside>

</div>
</div>

<input type="file"
       id="imageInput"
       accept="image/*"
       style="display:none">

<script>

/* =========================================================
   DRAWLAB V4
   OBJECT BASED DRAWING ENGINE
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const canvasWrap = document.getElementById("canvasWrap");
const layersEl = document.getElementById("layers");

const colorPicker = document.getElementById("colorPicker");
const sizeInput = document.getElementById("size");
const opacityInput = document.getElementById("opacity");
const imageInput = document.getElementById("imageInput");

let currentTool = "select";

let zoom = 1;

let selectedId = null;

let drawing = false;

let activeObject = null;

let startPoint = null;

let lastPoint = null;

let dragMode = null;

let dragStart = null;

let originalObject = null;


/* =========================================================
   STATE
========================================================= */

let objects = [];

let undoStack = [];

let redoStack = [];


/* =========================================================
   ID
========================================================= */

function uid(){

    return "obj_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,8);

}


/* =========================================================
   SNAPSHOT
========================================================= */

function snapshot(){

    return JSON.stringify(objects);

}

function restoreSnapshot(data){

    objects = JSON.parse(data);

    selectedId = null;

    render();

    updateLayers();

}


/* =========================================================
   UNDO
========================================================= */

function saveHistory(){

    undoStack.push(snapshot());

    if(undoStack.length > 50){

        undoStack.shift();

    }

    redoStack = [];

}


/* =========================================================
   UNDO / REDO
========================================================= */

function undo(){

    if(!undoStack.length){

        return;

    }

    redoStack.push(snapshot());

    const state = undoStack.pop();

    restoreSnapshot(state);

}


function redo(){

    if(!redoStack.length){

        return;

    }

    undoStack.push(snapshot());

    const state = redoStack.pop();

    restoreSnapshot(state);

}


/* =========================================================
   TOOL SELECT
========================================================= */

document.querySelectorAll(".tool").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".tool")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        currentTool = button.dataset.tool;

        canvas.style.cursor =
            currentTool === "select"
                ? "default"
                : "crosshair";

    });

});


/* =========================================================
   COORDINATES
========================================================= */

function getPoint(e){

    const rect = canvas.getBoundingClientRect();

    return {

        x:(e.clientX - rect.left) /
            (rect.width / canvas.width),

        y:(e.clientY - rect.top) /
            (rect.height / canvas.height)

    };

}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener("pointerdown", e => {

    e.preventDefault();

    canvas.setPointerCapture(e.pointerId);

    const p = getPoint(e);

    startPoint = p;

    lastPoint = p;

    drawing = true;


    /* SELECT */

    if(currentTool === "select"){

        const hit = hitTest(p);

        if(hit){

            selectedId = hit.id;

            activeObject = hit;

            dragStart = p;

            originalObject =
                JSON.parse(JSON.stringify(hit));

            dragMode = getHandle(p, hit);

            if(!dragMode){

                dragMode = "move";

            }

        }else{

            selectedId = null;

            activeObject = null;

        }

        render();

        updateLayers();

        return;

    }


    /* TEXT */

    if(currentTool === "text"){

        drawing = false;

        const text = prompt(
            "اكتبي النص:",
            "DrawLab ✨"
        );

        if(text){

            saveHistory();

            const obj = {

                id:uid(),

                type:"text",

                name:"Text",

                x:p.x,

                y:p.y,

                text:text,

                fontSize:32,

                fontFamily:"Arial",

                color:colorPicker.value,

                opacity:parseFloat(
                    opacityInput.value
                ),

                rotation:0

            };

            objects.push(obj);

            selectedId = obj.id;

            render();

            updateLayers();

        }

        return;

    }


    /* IMAGE */

    if(currentTool === "image"){

        drawing = false;

        uploadImage();

        return;

    }


    /* BRUSH */

    if(
        currentTool === "brush" ||
        currentTool === "eraser"
    ){

        activeObject = {

            id:uid(),

            type:"stroke",

            name:
                currentTool === "eraser"
                ? "Eraser"
                : "Brush",

            points:[p],

            color:colorPicker.value,

            size:parseFloat(sizeInput.value),

            opacity:parseFloat(
                opacityInput.value
            ),

            erase:
                currentTool === "eraser",

            rotation:0

        };

        saveHistory();

        objects.push(activeObject);

        selectedId = activeObject.id;

        return;

    }


    /* SHAPES */

    if(
        currentTool === "line" ||
        currentTool === "rect" ||
        currentTool === "circle"
    ){

        activeObject = {

            id:uid(),

            type:"shape",

            name:
                currentTool === "line"
                ? "Line"
                : currentTool === "rect"
                ? "Rectangle"
                : "Circle",

            shape:currentTool,

            x:p.x,

            y:p.y,

            width:0,

            height:0,

            color:colorPicker.value,

            size:parseFloat(sizeInput.value),

            opacity:parseFloat(
                opacityInput.value
            ),

            rotation:0,

            fill:false

        };

        saveHistory();

        objects.push(activeObject);

        selectedId = activeObject.id;

    }

});


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener("pointermove", e => {

    if(!drawing){

        return;

    }

    const p = getPoint(e);


    /* BRUSH */

    if(
        activeObject &&
        activeObject.type === "stroke"
    ){

        activeObject.points.push(p);

        render();

        return;

    }


    /* SHAPE */

    if(
        activeObject &&
        activeObject.type === "shape"
    ){

        activeObject.width =
            p.x - activeObject.x;

        activeObject.height =
            p.y - activeObject.y;

        render();

        return;

    }


    /* MOVE */

    if(
        currentTool === "select" &&
        activeObject
    ){

        const dx = p.x - dragStart.x;

        const dy = p.y - dragStart.y;

        if(dragMode === "move"){

            moveObject(
                activeObject,
                dx,
                dy
            );

            dragStart = p;

        }

        else if(
            dragMode === "resize"
        ){

            resizeObject(
                activeObject,
                p
            );

        }

        else if(
            dragMode === "rotate"
        ){

            rotateObject(
                activeObject,
                p
            );

        }

        render();

    }

});


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener("pointerup", e => {

    if(!drawing){

        return;

    }

    drawing = false;

    if(activeObject){

        activeObject = null;

    }

    render();

    updateLayers();

});


canvas.addEventListener("pointercancel", () => {

    drawing = false;

    activeObject = null;

});


/* =========================================================
   MOVE OBJECT
========================================================= */

function moveObject(obj, dx, dy){

    if(obj.type === "stroke"){

        obj.points.forEach(p => {

            p.x += dx;

            p.y += dy;

        });

    }else{

        obj.x += dx;

        obj.y += dy;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeObject(obj,p){

    if(obj.type === "text"){

        const dx = p.x - obj.x;

        obj.fontSize =
            Math.max(
                10,
                Math.abs(dx)
            );

        return;

    }

    if(obj.type === "image" ||
       obj.type === "shape"){

        obj.width =
            p.x - obj.x;

        obj.height =
            p.y - obj.y;

    }

}


/* =========================================================
   ROTATE
========================================================= */

function rotateObject(obj,p){

    let cx,cy;

    if(obj.type === "text"){

        cx = obj.x;

        cy = obj.y;

    }else{

        cx =
            obj.x +
            obj.width / 2;

        cy =
            obj.y +
            obj.height / 2;

    }

    obj.rotation =
        Math.atan2(
            p.y-cy,
            p.x-cx
        );

}


/* =========================================================
   HANDLE DETECTION
========================================================= */

function getHandle(p,obj){

    if(
        obj.type === "stroke"
    ){

        return null;

    }

    const box = getBounds(obj);

    const resizeDistance = 20;

    const rotatePoint = {

        x:box.cx,

        y:box.y - 35

    };

    if(
        distance(
            p,
            rotatePoint
        ) < resizeDistance
    ){

        return "rotate";

    }

    if(
        distance(
            p,
            {
                x:box.right,
                y:box.bottom
            }
        ) < resizeDistance
    ){

        return "resize";

    }

    return "move";

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    return Math.sqrt(

        Math.pow(a.x-b.x,2) +
        Math.pow(a.y-b.y,2)

    );

}


/* =========================================================
   BOUNDS
========================================================= */

function getBounds(obj){

    if(obj.type === "text"){

        const width =
            obj.text.length *
            obj.fontSize *
            .6;

        const height =
            obj.fontSize * 1.2;

        return {

            x:obj.x,

            y:obj.y-height,

            width,

            height,

            right:obj.x+width,

            bottom:obj.y,

            cx:obj.x+width/2,

            cy:obj.y-height/2

        };

    }


    if(
        obj.type === "image" ||
        obj.type === "shape"
    ){

        let x = obj.x;

        let y = obj.y;

        let width = obj.width;

        let height = obj.height;

        if(width < 0){

            x += width;

            width = Math.abs(width);

        }

        if(height < 0){

            y += height;

            height = Math.abs(height);

        }

        return {

            x,

            y,

            width,

            height,

            right:x+width,

            bottom:y+height,

            cx:x+width/2,

            cy:y+height/2

        };

    }


    if(obj.type === "stroke"){

        const xs =
            obj.points.map(p=>p.x);

        const ys =
            obj.points.map(p=>p.y);

        const x = Math.min(...xs);

        const y = Math.min(...ys);

        const right = Math.max(...xs);

        const bottom = Math.max(...ys);

        return {

            x,

            y,

            width:right-x,

            height:bottom-y,

            right,

            bottom,

            cx:(x+right)/2,

            cy:(y+bottom)/2

        };

    }

}


/* =========================================================
   HIT TEST
========================================================= */

function hitTest(p){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const obj = objects[i];

        if(!obj.visible === false){

            continue;

        }

        if(obj.type === "stroke"){

            const box = getBounds(obj);

            if(
                p.x >= box.x-10 &&
                p.x <= box.right+10 &&
                p.y >= box.y-10 &&
                p.y <= box.bottom+10
            ){

                return obj;

            }

        }else{

            const box = getBounds(obj);

            if(
                p.x >= box.x &&
                p.x <= box.right &&
                p.y >= box.y &&
                p.y <= box.bottom
            ){

                return obj;

            }

        }

    }

    return null;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    objects.forEach(obj => {

        if(obj.visible === false){

            return;

        }

        drawObject(obj);

    });


    if(selectedId){

        const obj =
            objects.find(
                o=>o.id === selectedId
            );

        if(obj){

            drawSelection(obj);

        }

    }

}


/* =========================================================
   DRAW OBJECT
========================================================= */

function drawObject(obj){

    ctx.save();

    ctx.globalAlpha =
        obj.opacity ?? 1;


    /* STROKE */

    if(obj.type === "stroke"){

        if(obj.points.length < 1){

            ctx.restore();

            return;

        }

        ctx.lineWidth = obj.size;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        if(obj.erase){

            ctx.globalCompositeOperation =
                "destination-out";

        }else{

            ctx.globalCompositeOperation =
                "source-over";

            ctx.strokeStyle =
                obj.color;

        }

        ctx.beginPath();

        ctx.moveTo(
            obj.points[0].x,
            obj.points[0].y
        );

        for(
            let i=1;
            i<obj.points.length;
            i++
        ){

            ctx.lineTo(
                obj.points[i].x,
                obj.points[i].y
            );

        }

        ctx.stroke();

        ctx.restore();

        return;

    }


    /* TRANSFORMED OBJECTS */

    let box = getBounds(obj);

    ctx.translate(
        box.cx,
        box.cy
    );

    if(obj.rotation){

        ctx.rotate(obj.rotation);

    }

    ctx.translate(
        -box.cx,
        -box.cy
    );


    /* SHAPE */

    if(obj.type === "shape"){

        ctx.strokeStyle =
            obj.color;

        ctx.lineWidth =
            obj.size;

        ctx.beginPath();

        if(obj.shape === "line"){

            ctx.moveTo(
                obj.x,
                obj.y
            );

            ctx.lineTo(
                obj.x + obj.width,
                obj.y + obj.height
            );

        }

        else if(obj.shape === "rect"){

            ctx.rect(
                obj.x,
                obj.y,
                obj.width,
                obj.height
            );

        }

        else if(obj.shape === "circle"){

            const cx =
                obj.x +
                obj.width/2;

            const cy =
                obj.y +
                obj.height/2;

            const rx =
                Math.abs(obj.width)/2;

            const ry =
                Math.abs(obj.height)/2;

            ctx.ellipse(
                cx,
                cy,
                rx,
                ry,
                0,
                0,
                Math.PI*2
            );

        }

        ctx.stroke();

    }


    /* TEXT */

    if(obj.type === "text"){

        ctx.fillStyle =
            obj.color;

        ctx.font =
            `${obj.fontSize}px ${obj.fontFamily}`;

        ctx.textBaseline =
            "alphabetic";

        ctx.fillText(
            obj.text,
            obj.x,
            obj.y
        );

    }


    /* IMAGE */

    if(obj.type === "image"){

        if(obj.image){

            ctx.drawImage(
                obj.image,
                obj.x,
                obj.y,
                obj.width,
                obj.height
            );

        }

    }

    ctx.restore();

}


/* =========================================================
   SELECTION UI
========================================================= */

function drawSelection(obj){

    if(obj.type === "stroke"){

        drawSelectionBox(
            getBounds(obj)
        );

        return;

    }

    const box =
        getBounds(obj);

    drawSelectionBox(box);

}


function drawSelectionBox(box){

    ctx.save();

    ctx.strokeStyle =
        "#8d68ff";

    ctx.lineWidth = 2;

    ctx.setLineDash([7,5]);

    ctx.strokeRect(
        box.x-5,
        box.y-5,
        box.width+10,
        box.height+10
    );

    ctx.setLineDash([]);


    /* RESIZE */

    ctx.fillStyle =
        "#8d68ff";

    ctx.fillRect(
        box.right,
        box.bottom,
        10,
        10
    );


    /* ROTATE */

    ctx.beginPath();

    ctx.moveTo(
        box.cx,
        box.y-5
    );

    ctx.lineTo(
        box.cx,
        box.y-35
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
        box.cx,
        box.y-40,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   LAYERS
========================================================= */

function updateLayers(){

    layersEl.innerHTML = "";

    [...objects]
        .reverse()
        .forEach(obj => {

            const layer =
                document.createElement("div");

            layer.className =
                "layer " +
                (
                    obj.id === selectedId
                    ? "selected"
                    : ""
                );

            let icon = "✨";

            if(obj.type === "text")
                icon = "T";

            if(obj.type === "image")
                icon = "🖼️";

            if(obj.type === "shape")
                icon = "🔷";

            if(obj.type === "stroke")
                icon = obj.erase
                    ? "🧹"
                    : "🖌️";


            layer.innerHTML = `

                <span class="layer-icon">
                    ${icon}
                </span>

                <span class="layer-name">
                    ${escapeHTML(obj.name)}
                </span>

                <div class="layer-actions">

                    <button
                        onclick="toggleVisibility('${obj.id}')">
                        ${obj.visible === false ? "🙈" : "👁️"}
                    </button>

                </div>

            `;


            layer.addEventListener(
                "click",
                e => {

                    if(
                        e.target.tagName === "BUTTON"
                    ){

                        return;

                    }

                    selectedId =
                        obj.id;

                    render();

                    updateLayers();

                }
            );


            layersEl.appendChild(layer);

        });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


/* =========================================================
   VISIBILITY
========================================================= */

function toggleVisibility(id){

    saveHistory();

    const obj =
        objects.find(
            o=>o.id===id
        );

    if(obj){

        obj.visible =
            obj.visible === false;

    }

    render();

    updateLayers();

}


/* =========================================================
   DELETE
========================================================= */

function deleteSelected(){

    if(!selectedId){

        return;

    }

    saveHistory();

    objects =
        objects.filter(
            o=>o.id!==selectedId
        );

    selectedId = null;

    render();

    updateLayers();

}


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSelected(){

    if(!selectedId){

        return;

    }

    const original =
        objects.find(
            o=>o.id===selectedId
        );

    if(!original){

        return;

    }

    saveHistory();

    const copy =
        JSON.parse(
            JSON.stringify(original)
        );

    copy.id = uid();

    copy.name =
        original.name + " Copy";


    if(copy.type === "stroke"){

        copy.points =
            copy.points.map(p => ({

                x:p.x+20,

                y:p.y+20

            }));

    }else{

        copy.x += 20;

        copy.y += 20;

    }

    objects.push(copy);

    selectedId =
        copy.id;

    render();

    updateLayers();

}


/* =========================================================
   LAYER UP
========================================================= */

function moveLayerUp(){

    if(!selectedId){

        return;

    }

    const index =
        objects.findIndex(
            o=>o.id===selectedId
        );

    if(
        index < 0 ||
        index >= objects.length-1
    ){

        return;

    }

    saveHistory();

    [
        objects[index],
        objects[index+1]
    ] =
    [
        objects[index+1],
        objects[index]
    ];

    render();

    updateLayers();

}


/* =========================================================
   LAYER DOWN
========================================================= */

function moveLayerDown(){

    if(!selectedId){

        return;

    }

    const index =
        objects.findIndex(
            o=>o.id===selectedId
        );

    if(index <= 0){

        return;

    }

    saveHistory();

    [
        objects[index],
        objects[index-1]
    ] =
    [
        objects[index-1],
        objects[index]
    ];

    render();

    updateLayers();

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadImage(){

    imageInput.click();

}


imageInput.addEventListener(
    "change",
    e => {

        const file =
            e.target.files[0];

        if(!file){

            return;

        }

        const reader =
            new FileReader();

        reader.onload = event => {

            const img =
                new Image();

            img.onload = () => {

                saveHistory();

                let width =
                    img.width;

                let height =
                    img.height;


                const max =
                    400;

                if(width > max){

                    const ratio =
                        max / width;

                    width = max;

                    height *= ratio;

                }

                if(height > max){

                    const ratio =
                        max / height;

                    height = max;

                    width *= ratio;

                }


                const obj = {

                    id:uid(),

                    type:"image",

                    name:file.name,

                    imageSrc:
                        event.target.result,

                    image:img,

                    x:
                        (canvas.width-width)/2,

                    y:
                        (canvas.height-height)/2,

                    width,

                    height,

                    opacity:
                        parseFloat(
                            opacityInput.value
                        ),

                    rotation:0

                };


                objects.push(obj);

                selectedId =
                    obj.id;

                render();

                updateLayers();

            };

            img.src =
                event.target.result;

        };

        reader.readAsDataURL(file);

        imageInput.value = "";

    }
);


/* =========================================================
   REBUILD IMAGES AFTER UNDO
========================================================= */

function rebuildImages(){

    objects.forEach(obj => {

        if(
            obj.type === "image" &&
            obj.imageSrc
        ){

            const img =
                new Image();

            img.onload = render;

            img.src =
                obj.imageSrc;

            obj.image = img;

        }

    });

}


/* =========================================================
   PATCH RESTORE
========================================================= */

const oldRestoreSnapshot =
    restoreSnapshot;

restoreSnapshot = function(data){

    oldRestoreSnapshot(data);

    rebuildImages();

};


/* =========================================================
   NEW PROJECT
========================================================= */

function newProject(){

    if(
        !confirm(
            "Start a new DrawLab project?"
        )
    ){

        return;

    }

    saveHistory();

    objects = [];

    selectedId = null;

    render();

    updateLayers();

}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas(){

    if(!objects.length){

        return;

    }

    saveHistory();

    objects = [];

    selectedId = null;

    render();

    updateLayers();

}


/* =========================================================
   EXPORT
========================================================= */

function exportPNG(){

    selectedId = null;

    render();

    const link =
        document.createElement("a");

    link.download =
        "drawlab-artwork.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

    updateLayers();

}


/* =========================================================
   ZOOM
========================================================= */

function updateZoom(){

    canvasWrap.style.transform =
        `scale(${zoom})`;

    document.getElementById(
        "zoomLabel"
    ).textContent =
        Math.round(zoom*100) + "%";

}


function zoomIn(){

    zoom =
        Math.min(
            2.5,
            zoom + .1
        );

    updateZoom();

}


function zoomOut(){

    zoom =
        Math.max(
            .3,
            zoom - .1
        );

    updateZoom();

}


function resetZoom(){

    zoom = 1;

    updateZoom();

}


/* =========================================================
   PANEL MOBILE
========================================================= */

function togglePanel(){

    document
        .getElementById("panel")
        .classList.toggle("open");

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "z"
        ){

            e.preventDefault();

            undo();

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "y"
        ){

            e.preventDefault();

            redo();

        }


        if(
            e.key === "Delete"
        ){

            deleteSelected();

        }


        if(
            e.key.toLowerCase() === "v"
        ){

            setTool("select");

        }


        if(
            e.key.toLowerCase() === "b"
        ){

            setTool("brush");

        }


        if(
            e.key.toLowerCase() === "e"
        ){

            setTool("eraser");

        }

    }
);


/* =========================================================
   TOOL HELPER
========================================================= */

function setTool(tool){

    currentTool = tool;

    document
        .querySelectorAll(".tool")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.tool === tool
            );

        });

}


/* =========================================================
   COLOR / SIZE / OPACITY
========================================================= */

colorPicker.addEventListener(
    "input",
    () => {

        if(!selectedId){

            return;

        }

        const obj =
            objects.find(
                o=>o.id===selectedId
            );

        if(obj){

            obj.color =
                colorPicker.value;

            render();

        }

    }
);


sizeInput.addEventListener(
    "input",
    () => {

        if(!selectedId){

            return;

        }

        const obj =
            objects.find(
                o=>o.id===selectedId
            );

        if(
            obj &&
            (
                obj.type === "stroke" ||
                obj.type === "shape"
            )
        ){

            obj.size =
                parseFloat(
                    sizeInput.value
                );

            render();

        }

    }
);


opacityInput.addEventListener(
    "input",
    () => {

        if(!selectedId){

            return;

        }

        const obj =
            objects.find(
                o=>o.id===selectedId
            );

        if(obj){

            obj.opacity =
                parseFloat(
                    opacityInput.value
                );

            render();

        }

    }
);


/* =========================================================
   INIT
========================================================= */

render();

updateLayers();

updateZoom();

</script>
