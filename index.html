<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DrawLab V5</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color:#332b43;

    background:
        linear-gradient(
            135deg,
            #fff3fa,
            #f3efff
        );
}

button,
input{
    font:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:68px;

    flex-shrink:0;

    padding:
        0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        linear-gradient(
            120deg,
            #ff9dcc,
            #d8b7ff 55%,
            #a9d9ff
        );

    box-shadow:
        0 5px 20px
        rgba(100,70,150,.18);

    position:relative;

    z-index:100;
}

.logo{

    color:white;

    font-size:24px;

    font-weight:900;

    letter-spacing:.3px;

    text-shadow:
        0 2px 5px
        rgba(70,40,100,.18);
}

.logo small{

    display:block;

    font-size:11px;

    margin-top:2px;

    opacity:.9;

    letter-spacing:.5px;
}

.header-actions{

    display:flex;

    align-items:center;

    gap:8px;
}

.header-btn{

    border:none;

    background:
        rgba(255,255,255,.86);

    color:#514565;

    padding:
        10px 13px;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;

    box-shadow:
        0 3px 10px
        rgba(80,50,110,.08);

    transition:.15s;
}

.header-btn:hover{

    background:white;

    transform:translateY(-1px);
}

.header-btn:active{

    transform:scale(.96);
}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    min-height:0;

    display:flex;

    position:relative;
}


/* =========================================================
   LEFT TOOLBAR
========================================================= */

.toolbar{

    width:82px;

    flex-shrink:0;

    background:
        rgba(255,255,255,.94);

    border-right:
        1px solid #ebe5f2;

    padding:10px 7px;

    display:flex;

    flex-direction:column;

    gap:7px;

    overflow-y:auto;

    z-index:50;
}

.tool{

    width:100%;

    min-height:55px;

    border:none;

    border-radius:15px;

    background:#faf8ff;

    color:#5d536c;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:10px;

    font-weight:800;

    transition:.15s;
}

.tool .icon{

    font-size:22px;

    line-height:22px;
}

.tool:hover{

    background:#f0eaff;
}

.tool.active{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff9dcc,
            #9e7cff
        );

    box-shadow:
        0 5px 14px
        rgba(140,90,220,.25);
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

    flex:1;

    min-width:0;

    min-height:0;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(255,180,220,.28),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(170,190,255,.28),
            transparent 30%
        ),

        #eeeaf5;
}

.canvas-wrap{

    position:relative;

    transform-origin:center center;

    box-shadow:
        0 18px 45px
        rgba(55,40,80,.22);
}

#canvas{

    display:block;

    width:900px;

    height:550px;

    background:white;

    touch-action:none;

    user-select:none;
}


/* =========================================================
   ZOOM
========================================================= */

.zoom-box{

    position:absolute;

    left:15px;

    bottom:15px;

    display:flex;

    align-items:center;

    gap:6px;

    padding:7px;

    border-radius:15px;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 5px 18px
        rgba(60,40,90,.14);

    z-index:10;
}

.zoom-box button{

    width:32px;

    height:32px;

    border:none;

    border-radius:10px;

    background:#eee7ff;

    color:#584879;

    font-weight:bold;

    cursor:pointer;
}

.zoom-box span{

    width:48px;

    text-align:center;

    font-size:12px;

    font-weight:800;
}


/* =========================================================
   RIGHT PANEL
========================================================= */

.panel{

    width:285px;

    flex-shrink:0;

    background:
        rgba(255,255,255,.97);

    border-left:
        1px solid #ebe5f2;

    padding:14px;

    overflow-y:auto;

    z-index:60;
}

.panel-title{

    font-weight:900;

    font-size:15px;

    margin-bottom:10px;
}

.section{

    padding:12px;

    margin-bottom:12px;

    border-radius:17px;

    background:#faf8ff;

    border:1px solid #f0ebf8;
}

.row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-bottom:10px;
}

.row:last-child{

    margin-bottom:0;
}

.row label{

    font-size:12px;

    color:#6d6379;

    font-weight:700;
}

input[type="range"]{

    width:130px;

    accent-color:#9a78ff;
}

input[type="color"]{

    width:44px;

    height:32px;

    padding:0;

    border:none;

    background:none;
}


/* =========================================================
   COLOR STUDIO
========================================================= */

.palette{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:7px;

    margin-top:8px;
}

.palette button{

    width:100%;

    aspect-ratio:1;

    border-radius:11px;

    border:
        2px solid white;

    box-shadow:
        0 2px 6px
        rgba(0,0,0,.12);

    cursor:pointer;

    transition:.15s;
}

.palette button:hover{

    transform:scale(1.1);
}


/* =========================================================
   BRUSH LIBRARY
========================================================= */

.brush-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.brush-preset{

    border:
        2px solid transparent;

    border-radius:14px;

    background:white;

    color:#514765;

    padding:10px 5px;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    font-size:21px;

    transition:.15s;
}

.brush-preset span{

    font-size:10px;

    font-weight:800;
}

.brush-preset:hover{

    background:#f1ebff;
}

.brush-preset.active{

    border-color:#9b7cff;

    background:#eee7ff;

    box-shadow:
        0 4px 10px
        rgba(120,80,210,.13);
}


/* =========================================================
   SMALL BUTTONS
========================================================= */

.small-btn{

    border:none;

    border-radius:10px;

    background:#eee7ff;

    color:#584b70;

    padding:7px 9px;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    transition:.15s;
}

.small-btn:hover{

    background:#dfd4ff;
}


/* =========================================================
   LAYERS
========================================================= */

.layers{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.layer{

    min-height:42px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:8px;

    border-radius:11px;

    background:white;

    border:
        1px solid #eee8f5;

    cursor:pointer;

    font-size:11px;
}

.layer.selected{

    background:#eee7ff;

    border-color:#bda8ff;
}

.layer-icon{

    width:24px;

    text-align:center;

    font-size:16px;
}

.layer-name{

    flex:1;

    min-width:0;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.layer-actions button{

    border:none;

    background:none;

    cursor:pointer;

    padding:3px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .header{

        height:58px;

        padding:
            0 9px;
    }

    .logo{

        font-size:18px;
    }

    .logo small{

        font-size:9px;
    }

    .header-actions{

        gap:5px;
    }

    .header-btn{

        padding:
            8px 9px;

        border-radius:12px;

        font-size:11px;
    }

    .toolbar{

        position:absolute;

        left:0;

        right:0;

        bottom:0;

        width:100%;

        height:72px;

        padding:6px;

        flex-direction:row;

        overflow-x:auto;

        overflow-y:hidden;

        border-right:none;

        border-top:
            1px solid #ebe5f2;

        z-index:100;
    }

    .tool{

        min-width:66px;

        width:66px;

        min-height:59px;

        flex-shrink:0;
    }

    .tool .icon{

        font-size:20px;
    }

    .panel{

        position:absolute;

        top:0;

        right:0;

        bottom:72px;

        width:275px;

        transform:
            translateX(100%);

        transition:
            transform .25s ease;

        box-shadow:
            -8px 0 25px
            rgba(50,30,80,.15);

        z-index:150;
    }

    .panel.open{

        transform:
            translateX(0);
    }

    .zoom-box{

        bottom:82px;

        left:8px;
    }

    #canvas{

        width:900px;

        height:550px;
    }
}

</style>
</head>

<script>

/* =========================================================
   DRAWLAB V5 ENGINE
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const canvasWrap =
    document.getElementById("canvasWrap");

const layersEl =
    document.getElementById("layers");

const colorPicker =
    document.getElementById("colorPicker");

const sizeInput =
    document.getElementById("size");

const opacityInput =
    document.getElementById("opacity");

const imageInput =
    document.getElementById("imageInput");


let currentTool =
    "select";

let currentBrush =
    "pencil";

let zoom =
    1;

let objects =
    [];

let selectedId =
    null;

let activeObject =
    null;

let drawing =
    false;

let startPoint =
    null;

let lastPoint =
    null;

let dragMode =
    null;

let dragStart =
    null;

let undoStack =
    [];

let redoStack =
    [];


/* =========================================================
   ID
========================================================= */

function uid(){

    return "obj_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,8);

}


/* =========================================================
   HISTORY
========================================================= */

function snapshot(){

    return JSON.stringify(
        objects.map(obj => {

            const copy =
                JSON.parse(
                    JSON.stringify(obj)
                );

            delete copy.image;

            return copy;

        })
    );

}


function saveHistory(){

    undoStack.push(
        snapshot()
    );

    if(
        undoStack.length > 50
    ){

        undoStack.shift();

    }

    redoStack = [];

}


function restoreState(data){

    objects =
        JSON.parse(data);

    rebuildImages();

    selectedId =
        null;

    render();

    updateLayers();

}


function undo(){

    if(!undoStack.length)
        return;

    redoStack.push(
        snapshot()
    );

    const state =
        undoStack.pop();

    restoreState(state);

}


function redo(){

    if(!redoStack.length)
        return;

    undoStack.push(
        snapshot()
    );

    const state =
        redoStack.pop();

    restoreState(state);

}


/* =========================================================
   TOOLS
========================================================= */

document
.querySelectorAll(".tool")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            setTool(
                button.dataset.tool
            );

        }
    );

});


function setTool(tool){

    currentTool =
        tool;

    document
    .querySelectorAll(".tool")
    .forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.tool === tool
        );

    });

}


/* =========================================================
   COORDINATES
========================================================= */

function getPoint(e){

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left) *
            (canvas.width / rect.width),

        y:
            (e.clientY - rect.top) *
            (canvas.height / rect.height)

    };

}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        canvas.setPointerCapture(
            e.pointerId
        );

        const p =
            getPoint(e);

        startPoint =
            p;

        lastPoint =
            p;

        drawing =
            true;


        /* SELECT */

        if(
            currentTool === "select"
        ){

            const hit =
                hitTest(p);

            if(hit){

                selectedId =
                    hit.id;

                activeObject =
                    hit;

                dragStart =
                    p;

                dragMode =
                    getHandle(
                        p,
                        hit
                    );

            }
            else{

                selectedId =
                    null;

                activeObject =
                    null;

            }

            render();

            updateLayers();

            return;

        }


        /* TEXT */

        if(
            currentTool === "text"
        ){

            drawing =
                false;

            const text =
                prompt(
                    "اكتبي النص:",
                    "DrawLab ✨"
                );

            if(text){

                saveHistory();

                const obj = {

                    id:uid(),

                    type:"text",

                    name:"Text",

                    x:p.x,

                    y:p.y,

                    text:text,

                    fontSize:32,

                    fontFamily:
                        "Arial",

                    color:
                        colorPicker.value,

                    opacity:
                        parseFloat(
                            opacityInput.value
                        ),

                    rotation:0,

                    visible:true

                };

                objects.push(obj);

                selectedId =
                    obj.id;

                render();

                updateLayers();

            }

            return;

        }


        /* IMAGE */

        if(
            currentTool === "image"
        ){

            drawing =
                false;

            uploadImage();

            return;

        }


        /* BRUSH */

        if(
            currentTool === "brush" ||
            currentTool === "eraser"
        ){

            saveHistory();

            activeObject = {

                id:uid(),

                type:"stroke",

                name:
                    currentTool ===
                    "eraser"
                    ? "Eraser"
                    : currentBrush,

                brushType:
                    currentTool ===
                    "eraser"
                    ? "eraser"
                    : currentBrush,

                points:[p],

                color:
                    colorPicker.value,

                size:
                    parseFloat(
                        sizeInput.value
                    ),

                opacity:
                    parseFloat(
                        opacityInput.value
                    ),

                erase:
                    currentTool ===
                    "eraser",

                visible:true

            };

            objects.push(
                activeObject
            );

            selectedId =
                activeObject.id;

            return;

        }


        /* SHAPES */

        if(
            currentTool === "line" ||
            currentTool === "rect" ||
            currentTool === "circle"
        ){

            saveHistory();

            activeObject = {

                id:uid(),

                type:"shape",

                name:
                    currentTool === "line"
                    ? "Line"
                    : currentTool === "rect"
                    ? "Rectangle"
                    : "Circle",

                shape:
                    currentTool,

                x:p.x,

                y:p.y,

                width:0,

                height:0,

                color:
                    colorPicker.value,

                size:
                    parseFloat(
                        sizeInput.value
                    ),

                opacity:
                    parseFloat(
                        opacityInput.value
                    ),

                rotation:0,

                visible:true

            };

            objects.push(
                activeObject
            );

            selectedId =
                activeObject.id;

        }

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    e => {

        if(!drawing)
            return;

        const p =
            getPoint(e);


        /* BRUSH */

        if(
            activeObject &&
            activeObject.type ===
            "stroke"
        ){

            activeObject.points.push(
                p
            );

            render();

            return;

        }


        /* SHAPE */

        if(
            activeObject &&
            activeObject.type ===
            "shape"
        ){

            activeObject.width =
                p.x -
                activeObject.x;

            activeObject.height =
                p.y -
                activeObject.y;

            render();

            return;

        }


        /* MOVE */

        if(
            currentTool === "select" &&
            activeObject
        ){

            const dx =
                p.x -
                dragStart.x;

            const dy =
                p.y -
                dragStart.y;


            if(
                dragMode === "move"
            ){

                moveObject(
                    activeObject,
                    dx,
                    dy
                );

                dragStart =
                    p;

            }


            if(
                dragMode === "resize"
            ){

                resizeObject(
                    activeObject,
                    p
                );

            }


            if(
                dragMode === "rotate"
            ){

                rotateObject(
                    activeObject,
                    p
                );

            }

            render();

        }

    }
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    () => {

        drawing =
            false;

        activeObject =
            null;

        render();

        updateLayers();

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        drawing =
            false;

        activeObject =
            null;

    }
);


/* =========================================================
   MOVE
========================================================= */

function moveObject(
    obj,
    dx,
    dy
){

    if(
        obj.type === "stroke"
    ){

        obj.points.forEach(
            p => {

                p.x += dx;

                p.y += dy;

            }
        );

    }
    else{

        obj.x += dx;

        obj.y += dy;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeObject(
    obj,
    p
){

    if(
        obj.type === "text"
    ){

        obj.fontSize =
            Math.max(
                10,
                Math.abs(
                    p.x - obj.x
                )
            );

        return;

    }


    if(
        obj.type === "image" ||
        obj.type === "shape"
    ){

        obj.width =
            p.x - obj.x;

        obj.height =
            p.y - obj.y;

    }

}


/* =========================================================
   ROTATE
========================================================= */

function rotateObject(
    obj,
    p
){

    const box =
        getBounds(obj);

    const angle =
        Math.atan2(
            p.y - box.cy,
            p.x - box.cx
        );

    obj.rotation =
        angle;

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    return Math.sqrt(

        Math.pow(
            a.x-b.x,
            2
        )

        +

        Math.pow(
            a.y-b.y,
            2
        )

    );

}


/* =========================================================
   BOUNDS
========================================================= */

function getBounds(obj){

    if(
        obj.type === "text"
    ){

        const width =
            Math.max(
                20,
                obj.text.length *
                obj.fontSize *
                .6
            );

        const height =
            obj.fontSize *
            1.2;

        return {

            x:obj.x,

            y:
                obj.y -
                height,

            width,

            height,

            right:
                obj.x + width,

            bottom:
                obj.y,

            cx:
                obj.x +
                width/2,

            cy:
                obj.y -
                height/2

        };

    }


    if(
        obj.type === "image" ||
        obj.type === "shape"
    ){

        let x =
            obj.x;

        let y =
            obj.y;

        let width =
            obj.width;

        let height =
            obj.height;


        if(width < 0){

            x += width;

            width =
                Math.abs(width);

        }

        if(height < 0){

            y += height;

            height =
                Math.abs(height);

        }


        return {

            x,

            y,

            width,

            height,

            right:
                x + width,

            bottom:
                y + height,

            cx:
                x + width/2,

            cy:
                y + height/2

        };

    }


    if(
        obj.type === "stroke"
    ){

        if(
            !obj.points ||
            !obj.points.length
        ){

            return {
                x:0,
                y:0,
                width:0,
                height:0,
                right:0,
                bottom:0,
                cx:0,
                cy:0
            };

        }


        const xs =
            obj.points.map(
                p => p.x
            );

        const ys =
            obj.points.map(
                p => p.y
            );


        const x =
            Math.min(...xs);

        const y =
            Math.min(...ys);

        const right =
            Math.max(...xs);

        const bottom =
            Math.max(...ys);


        return {

            x,

            y,

            width:
                right-x,

            height:
                bottom-y,

            right,

            bottom,

            cx:
                (x+right)/2,

            cy:
                (y+bottom)/2

        };

    }

}


/* =========================================================
   HIT TEST
========================================================= */

function hitTest(p){

    for(
        let i =
            objects.length-1;
        i >= 0;
        i--
    ){

        const obj =
            objects[i];

        if(
            obj.visible === false
        ){

            continue;

        }


        const box =
            getBounds(obj);


        const padding =
            obj.type === "stroke"
            ? 14
            : 4;


        if(

            p.x >=
                box.x-padding &&

            p.x <=
                box.right+padding &&

            p.y >=
                box.y-padding &&

            p.y <=
                box.bottom+padding

        ){

            return obj;

        }

    }

    return null;

}


/* =========================================================
   HANDLE
========================================================= */

function getHandle(
    p,
    obj
){

    const box =
        getBounds(obj);

    const rotatePoint = {

        x:box.cx,

        y:
            box.y - 40

    };


    if(
        distance(
            p,
            rotatePoint
        ) < 18
    ){

        return "rotate";

    }


    if(
        distance(
            p,
            {
                x:box.right,
                y:box.bottom
            }
        ) < 22
    ){

        return "resize";

    }


    return "move";

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();


    objects.forEach(
        obj => {

            if(
                obj.visible === false
            ){

                return;

            }

            drawObject(obj);

        }
    );


    if(selectedId){

        const selected =
            objects.find(
                o =>
                    o.id ===
                    selectedId
            );

        if(selected){

            drawSelection(
                selected
            );

        }

    }

}


/* =========================================================
   DRAW OBJECT
========================================================= */

function drawObject(obj){

    ctx.save();

    ctx.globalAlpha =
        obj.opacity ?? 1;


    /* =====================================================
       STROKE
    ===================================================== */

    if(
        obj.type === "stroke"
    ){

        if(
            !obj.points ||
            obj.points.length === 0
        ){

            ctx.restore();

            return;

        }


        if(obj.erase){

            ctx.globalCompositeOperation =
                "destination-out";

        }
        else{

            ctx.globalCompositeOperation =
                "source-over";

            ctx.strokeStyle =
                obj.color;

        }


        const brush =
            obj.brushType;


        /* PENCIL */

        if(
            brush === "pencil"
        ){

            ctx.lineWidth =
                obj.size;

            ctx.globalAlpha =
                obj.opacity * .75;

        }


        /* INK */

        else if(
            brush === "ink"
        ){

            ctx.lineWidth =
                obj.size;

            ctx.globalAlpha =
                obj.opacity;

        }


        /* MARKER */

        else if(
            brush === "marker"
        ){

            ctx.lineWidth =
                obj.size * 1.6;

            ctx.globalAlpha =
                obj.opacity * .55;

        }


        /* WATERCOLOR */

        else if(
            brush === "watercolor"
        ){

            ctx.lineWidth =
                obj.size * 1.8;

            ctx.globalAlpha =
                obj.opacity * .25;

        }


        /* NEON */

        else if(
            brush === "neon"
        ){

            ctx.lineWidth =
                obj.size;

            ctx.globalAlpha =
                obj.opacity;

            ctx.shadowBlur =
                20;

            ctx.shadowColor =
                obj.color;

        }


        /* SPRAY */

        else if(
            brush === "spray"
        ){

            ctx.lineWidth =
                2;

            ctx.globalAlpha =
                obj.opacity;

        }


        /* ERASER */

        else{

            ctx.lineWidth =
                obj.size;

            ctx.globalAlpha =
                obj.opacity;

        }


        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";


        /* NORMAL LINE */

        if(
            brush !== "spray"
        ){

            ctx.beginPath();

            ctx.moveTo(
                obj.points[0].x,
                obj.points[0].y
            );


            for(
                let i=1;
                i<obj.points.length;
                i++
            ){

                const point =
                    obj.points[i];

                ctx.lineTo(
                    point.x,
                    point.y
                );

            }


            ctx.stroke();

        }


        /* SPRAY PARTICLES */

        if(
            brush === "spray"
        ){

            ctx.fillStyle =
                obj.color;

            obj.points.forEach(
                point => {

                    for(
                        let i=0;
                        i<8;
                        i++
                    ){

                        const angle =
                            Math.random() *
                            Math.PI * 2;

                        const radius =
                            Math.random() *
                            obj.size;

                        ctx.globalAlpha =
                            obj.opacity *
                            Math.random();

                        ctx.beginPath();

                        ctx.arc(

                            point.x +
                            Math.cos(angle) *
                            radius,

                            point.y +
                            Math.sin(angle) *
                            radius,

                            Math.random()*2,

                            0,

                            Math.PI*2

                        );

                        ctx.fill();

                    }

                }
            );

        }


        ctx.shadowBlur =
            0;

        ctx.shadowColor =
            "transparent";

        ctx.globalCompositeOperation =
            "source-over";

        ctx.restore();

        return;

    }


    /* =====================================================
       OTHER OBJECTS
    ===================================================== */

    const box =
        getBounds(obj);


    ctx.translate(
        box.cx,
        box.cy
    );


    if(obj.rotation){

        ctx.rotate(
            obj.rotation
        );

    }


    ctx.translate(
        -box.cx,
        -box.cy
    );


    /* =====================================================
       SHAPE
    ===================================================== */

    if(
        obj.type === "shape"
    ){

        ctx.strokeStyle =
            obj.color;

        ctx.lineWidth =
            obj.size;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.beginPath();


        if(
            obj.shape === "line"
        ){

            ctx.moveTo(
                obj.x,
                obj.y
            );

            ctx.lineTo(
                obj.x +
                obj.width,

                obj.y +
                obj.height
            );

        }


        else if(
            obj.shape === "rect"
        ){

            ctx.rect(
                obj.x,
                obj.y,
                obj.width,
                obj.height
            );

        }


        else if(
            obj.shape === "circle"
        ){

            const cx =
                obj.x +
                obj.width/2;

            const cy =
                obj.y +
                obj.height/2;

            const rx =
                Math.abs(
                    obj.width
                )/2;

            const ry =
                Math.abs(
                    obj.height
                )/2;

            ctx.ellipse(
                cx,
                cy,
                rx,
                ry,
                0,
                0,
                Math.PI*2
            );

        }


        ctx.stroke();

    }


    /* =====================================================
       TEXT
    ===================================================== */

    if(
        obj.type === "text"
    ){

        ctx.fillStyle =
            obj.color;

        ctx.font =
            `${obj.fontSize}px ${obj.fontFamily}`;

        ctx.textBaseline =
            "alphabetic";

        ctx.fillText(
            obj.text,
            obj.x,
            obj.y
        );

    }


    /* =====================================================
       IMAGE
    ===================================================== */

    if(
        obj.type === "image"
    ){

        if(obj.image){

            ctx.drawImage(

                obj.image,

                obj.x,
                obj.y,

                obj.width,
                obj.height

            );

        }

    }


    ctx.restore();

}


/* =========================================================
   SELECTION
========================================================= */

function drawSelection(obj){

    const box =
        getBounds(obj);


    ctx.save();


    ctx.strokeStyle =
        "#8c68ff";

    ctx.lineWidth =
        2;

    ctx.setLineDash(
        [7,5]
    );


    ctx.strokeRect(

        box.x-5,

        box.y-5,

        box.width+10,

        box.height+10

    );


    ctx.setLineDash([]);


    /* RESIZE HANDLE */

    ctx.fillStyle =
        "#8c68ff";


    ctx.fillRect(

        box.right,

        box.bottom,

        11,

        11

    );


    /* ROTATION LINE */

    ctx.beginPath();

    ctx.moveTo(

        box.cx,

        box.y-5

    );

    ctx.lineTo(

        box.cx,

        box.y-34

    );

    ctx.stroke();


    /* ROTATION HANDLE */

    ctx.beginPath();

    ctx.arc(

        box.cx,

        box.y-40,

        7,

        0,

        Math.PI*2

    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   LAYERS
========================================================= */

function updateLayers(){

    layersEl.innerHTML =
        "";


    [...objects]
    .reverse()
    .forEach(
        obj => {

            const layer =
                document.createElement(
                    "div"
                );


            layer.className =
                "layer " +
                (
                    obj.id ===
                    selectedId
                    ? "selected"
                    : ""
                );


            let icon =
                "✨";


            if(
                obj.type === "text"
            )
                icon = "T";


            if(
                obj.type === "image"
            )
                icon = "🖼️";


            if(
                obj.type === "shape"
            )
                icon = "🔷";


            if(
                obj.type === "stroke"
            )
                icon =
                    obj.erase
                    ? "🧹"
                    : "🖌️";


            layer.innerHTML = `

                <span class="layer-icon">
                    ${icon}
                </span>

                <span class="layer-name">
                    ${escapeHTML(obj.name)}
                </span>

                <div class="layer-actions">

                    <button
                        onclick="
                            event.stopPropagation();
                            toggleVisibility('${obj.id}')
                        ">

                        ${
                            obj.visible === false
                            ? "🙈"
                            : "👁️"
                        }

                    </button>

                </div>

            `;


            layer.addEventListener(
                "click",
                () => {

                    selectedId =
                        obj.id;

                    render();

                    updateLayers();

                }
            );


            layersEl.appendChild(
                layer
            );

        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(str){

    return String(str)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        );

}


/* =========================================================
   VISIBILITY
========================================================= */

function toggleVisibility(id){

    saveHistory();


    const obj =
        objects.find(
            o => o.id === id
        );


    if(obj){

        obj.visible =
            obj.visible === false;

    }


    render();

    updateLayers();

}


/* =========================================================
   DELETE
========================================================= */

function deleteSelected(){

    if(!selectedId)
        return;


    saveHistory();


    objects =
        objects.filter(
            o =>
                o.id !==
                selectedId
        );


    selectedId =
        null;


    render();

    updateLayers();

}


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSelected(){

    if(!selectedId)
        return;


    const original =
        objects.find(
            o =>
                o.id ===
                selectedId
        );


    if(!original)
        return;


    saveHistory();


    const copy =
        JSON.parse(
            JSON.stringify(
                original
            )
        );


    copy.id =
        uid();


    copy.name =
        original.name +
        " Copy";


    if(
        copy.type ===
        "stroke"
    ){

        copy.points =
            copy.points.map(
                p => ({

                    x:p.x+20,

                    y:p.y+20

                })
            );

    }
    else{

        copy.x += 20;

        copy.y += 20;

    }


    if(
        original.type ===
        "image"
    ){

        const img =
            new Image();

        img.onload =
            render;

        img.src =
            original.imageSrc;

        copy.image =
            img;

    }


    objects.push(
        copy
    );


    selectedId =
        copy.id;


    render();

    updateLayers();

}


/* =========================================================
   LAYER UP
========================================================= */

function moveLayerUp(){

    if(!selectedId)
        return;


    const index =
        objects.findIndex(
            o =>
                o.id ===
                selectedId
        );


    if(
        index < 0 ||
        index >=
        objects.length-1
    )
        return;


    saveHistory();


    [
        objects[index],
        objects[index+1]
    ] =
    [
        objects[index+1],
        objects[index]
    ];


    render();

    updateLayers();

}


/* =========================================================
   LAYER DOWN
========================================================= */

function moveLayerDown(){

    if(!selectedId)
        return;


    const index =
        objects.findIndex(
            o =>
                o.id ===
                selectedId
        );


    if(index <= 0)
        return;


    saveHistory();


    [
        objects[index],
        objects[index-1]
    ] =
    [
        objects[index-1],
        objects[index]
    ];


    render();

    updateLayers();

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadImage(){

    imageInput.click();

}


imageInput.addEventListener(
    "change",
    e => {

        const file =
            e.target.files[0];


        if(!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
            event => {

                const img =
                    new Image();


                img.onload =
                    () => {

                        saveHistory();


                        let width =
                            img.width;

                        let height =
                            img.height;


                        const max =
                            420;


                        if(
                            width > max
                        ){

                            const ratio =
                                max /
                                width;

                            width =
                                max;

                            height *=
                                ratio;

                        }


                        if(
                            height > max
                        ){

                            const ratio =
                                max /
                                height;

                            height =
                                max;

                            width *=
                                ratio;

                        }


                        const obj = {

                            id:uid(),

                            type:"image",

                            name:
                                file.name,

                            imageSrc:
                                event.target.result,

                            image:img,

                            x:
                                (
                                    canvas.width -
                                    width
                                ) / 2,

                            y:
                                (
                                    canvas.height -
                                    height
                                ) / 2,

                            width,

                            height,

                            opacity:
                                parseFloat(
                                    opacityInput.value
                                ),

                            rotation:0,

                            visible:true

                        };


                        objects.push(
                            obj
                        );


                        selectedId =
                            obj.id;


                        render();

                        updateLayers();

                    };


                img.src =
                    event.target.result;

            };


        reader.readAsDataURL(
            file
        );


        imageInput.value =
            "";

    }
);


/* =========================================================
   REBUILD IMAGES
========================================================= */

function rebuildImages(){

    objects.forEach(
        obj => {

            if(
                obj.type === "image" &&
                obj.imageSrc
            ){

                const img =
                    new Image();


                img.onload =
                    () => render();


                img.src =
                    obj.imageSrc;


                obj.image =
                    img;

            }

        }
    );

}

   NEW PROJECT

        )

}

function clearCanvas(){

    )

   EXPORT

/* =========================================================
   ZOOM
========================================================= */

function updateZoom(){

    canvasWrap.style.transform =
        `scale(${zoom})`;


    document
    .getElementById(
        "zoomLabel"
    )
    .textContent =
        Math.round(
            zoom * 100
        ) + "%";

}


function zoomIn(){

    zoom =
        Math.min(
            2.5,
            zoom + .1
        );


    updateZoom();

}


function zoomOut(){

    zoom =
        Math.max(
            .3,
            zoom - .1
        );


    updateZoom();

}


function resetZoom(){

    zoom =
        1;


    updateZoom();

}


/* =========================================================
   MOBILE PANEL
========================================================= */

function togglePanel(){

    document
        .getElementById(
            "panel"
        )
        .classList.toggle(
            "open"
        );

}


/* =========================================================
   COLOR
========================================================= */

colorPicker.addEventListener(
    "input",
    () => {

        if(!selectedId)
            return;


        const obj =
            objects.find(
                o =>
                    o.id ===
                    selectedId
            );


        if(obj){

            obj.color =
                colorPicker.value;


            render();

        }

    }
);


/* =========================================================
   PALETTE
========================================================= */

document
.querySelectorAll(
    ".palette button"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                const color =
                    button.dataset.color;


                colorPicker.value =
                    color;


                if(selectedId){

                    const obj =
                        objects.find(
                            o =>
                                o.id ===
                                selectedId
                        );


                    if(obj){

                        obj.color =
                            color;

                        render();

                    }

                }

            }
        );

    }
);


/* =========================================================
   BRUSH LIBRARY
========================================================= */

const brushPresets = {

    pencil:{
        size:4,
        opacity:.75
    },

    ink:{
        size:6,
        opacity:1
    },

    marker:{
        size:18,
        opacity:.65
    },

    watercolor:{
        size:25,
        opacity:.25
    },

    neon:{
        size:9,
        opacity:1
    },

    spray:{
        size:28,
        opacity:.35
    }

};


document
.querySelectorAll(
    ".brush-preset"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(
                    ".brush-preset"
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                currentBrush =
                    button.dataset.brush;


                const preset =
                    brushPresets[
                        currentBrush
                    ];


                sizeInput.value =
                    preset.size;


                opacityInput.value =
                    preset.opacity;


                setTool(
                    "brush"
                );

            }
        );

    }
);


/* =========================================================
   SIZE
========================================================= */

sizeInput.addEventListener(
    "input",
    () => {

        if(!selectedId)
            return;


        const obj =
            objects.find(
                o =>
                    o.id ===
                    selectedId
            );


        if(
            obj &&
            (
                obj.type ===
                "stroke" ||
                obj.type ===
                "shape"
            )
        ){

            obj.size =
                parseFloat(
                    sizeInput.value
                );


            render();

        }

    }
);


/* =========================================================
   OPACITY
========================================================= */

opacityInput.addEventListener(
    "input",
    () => {

        if(!selectedId)
            return;


        const obj =
            objects.find(
                o =>
                    o.id ===
                    selectedId
            );


        if(obj){

            obj.opacity =
                parseFloat(
                    opacityInput.value
                );


            render();

        }

    }
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.ctrlKey &&
            e.key.toLowerCase() ===
            "z"
        ){

            e.preventDefault();

            undo();

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() ===
            "y"
        ){

            e.preventDefault();

            redo();

        }


        if(
            e.key ===
            "Delete"
        ){

            deleteSelected();

        }


        if(
            e.key.toLowerCase() ===
            "v"
        ){

            setTool(
                "select"
            );

        }


        if(
            e.key.toLowerCase() ===
            "b"
        ){

            setTool(
                "brush"
            );

        }


        if(
            e.key.toLowerCase() ===
            "e"
        ){

            setTool(
                "eraser"
            );

        }

    }
);


/* =========================================================
   INIT
========================================================= */

render();

updateLayers();

updateZoom();

</script>

</body>
</html>
