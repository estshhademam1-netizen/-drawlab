<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DrawLab V5.3</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f5ff;
}

button,
input,
select{
    font:inherit;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

header{
    height:64px;
    flex-shrink:0;
    background:rgba(255,255,255,.97);
    border-bottom:1px solid #e8e3f5;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    z-index:500;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#6c5ce7;
}

.logo span{
    color:#ff6b9d;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:none;
    background:#f1edff;
    color:#5f50c8;

    border-radius:12px;
    padding:9px 13px;

    cursor:pointer;
    font-weight:700;
}

.header-btn:hover{
    background:#e7e1ff;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
    position:relative;
}

/* ================= WORKSPACE ================= */

.workspace{
    flex:1;
    min-width:0;
    min-height:0;

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            45deg,
            #f2effb 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            #f2effb 25%,
            transparent 25%
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            #f2effb 75%
        ),
        linear-gradient(
            -45deg,
            transparent 75%,
            #f2effb 75%
        );

    background-size:28px 28px;

    background-position:
        0 0,
        0 14px,
        14px -14px,
        -14px 0;
}

.canvas-wrap{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    transform-origin:center center;

    background:white;

    box-shadow:
        0 15px 45px
        rgba(60,40,100,.18);

    border-radius:6px;

    overflow:hidden;
}

#canvas{
    display:block;

    background:white;

    touch-action:none;
}

/* ================= ZOOM ================= */

.zoom-controls{
    position:absolute;

    bottom:14px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:5px;

    padding:6px;

    background:rgba(255,255,255,.96);

    border:1px solid #e5def5;

    border-radius:15px;

    box-shadow:
        0 5px 20px
        rgba(70,50,100,.12);

    z-index:80;
}

.zoom-btn{
    width:34px;
    height:34px;

    border:none;

    border-radius:10px;

    background:#f1edff;

    color:#6555d6;

    cursor:pointer;
    font-weight:bold;
}

.zoom-value{
    min-width:58px;

    text-align:center;

    font-size:13px;

    font-weight:700;

    color:#555;
}

/* ================= TOOLBAR ================= */

.toolbar{
    width:82px;

    flex-shrink:0;

    background:white;

    border-right:1px solid #e8e3f5;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:12px 8px;

    gap:8px;

    z-index:300;

    overflow-y:auto;
}

.tool{
    width:58px;
    height:52px;

    flex-shrink:0;

    border:none;

    border-radius:15px;

    background:#f5f2ff;

    color:#6658c9;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:3px;

    font-size:20px;
}

.tool small{
    font-size:9px;
    font-weight:700;
}

.tool:hover{
    background:#ebe5ff;
}

.tool.active{
    background:#6c5ce7;
    color:white;

    box-shadow:
        0 5px 15px
        rgba(108,92,231,.25);
}

.tool-menu{
    display:none;
}

/* ================= PANEL ================= */

.panel{
    width:330px;

    flex-shrink:0;

    background:rgba(255,255,255,.98);

    border-left:1px solid #e8e3f5;

    padding:16px;

    overflow-y:auto;

    z-index:200;
}

.panel-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;
}

.panel-title{
    font-size:18px;

    font-weight:800;

    color:#5145a8;
}

.close-panel-btn{
    width:38px;
    height:38px;

    border:none;

    border-radius:12px;

    background:#ffe8f0;

    color:#e64f83;

    cursor:pointer;

    font-size:20px;

    font-weight:bold;
}

.close-panel-btn:hover{
    background:#ffd8e5;
}

.panel-section{
    background:#faf9ff;

    border:1px solid #eeeafb;

    border-radius:16px;

    padding:13px;

    margin-bottom:12px;
}

.section-title{
    font-size:12px;

    font-weight:800;

    color:#777;

    margin-bottom:10px;

    text-transform:uppercase;
}

/* ================= COLORS ================= */

.color-row{
    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.color{
    width:29px;
    height:29px;

    border-radius:50%;

    border:3px solid white;

    box-shadow:
        0 0 0 1px #ddd;

    cursor:pointer;
}

.color.active{
    box-shadow:
        0 0 0 3px #6c5ce7;
}

.custom-color{
    width:100%;
    height:40px;

    border:none;

    padding:0;

    background:transparent;

    cursor:pointer;
}

/* ================= BRUSHES ================= */

.brush-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.brush{
    border:1px solid #e4dff5;

    background:white;

    border-radius:12px;

    padding:9px 6px;

    cursor:pointer;

    color:#555;

    font-size:12px;

    font-weight:700;
}

.brush.active{
    border-color:#6c5ce7;

    background:#eeeaff;

    color:#5b4ec5;
}

/* ================= CONTROLS ================= */

.control{
    margin-bottom:13px;
}

.control label{
    display:flex;

    justify-content:space-between;

    margin-bottom:6px;

    font-size:12px;

    font-weight:700;

    color:#666;
}

input[type="range"]{
    width:100%;

    accent-color:#6c5ce7;
}

.action-row{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.action-btn{
    border:none;

    border-radius:11px;

    background:#eeeaff;

    color:#5c4fc2;

    padding:9px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;
}

.action-btn:hover{
    background:#e2dcff;
}

/* ================= LAYERS ================= */

.layers{
    display:flex;

    flex-direction:column;

    gap:6px;
}

.layer{
    display:flex;

    align-items:center;

    gap:7px;

    background:white;

    border:1px solid #e8e3f5;

    border-radius:10px;

    padding:8px;

    cursor:pointer;
}

.layer.active{
    border-color:#6c5ce7;

    background:#f1edff;
}

.layer-name{
    flex:1;

    font-size:12px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.layer-actions{
    display:flex;

    gap:3px;
}

.layer-actions button{
    border:none;

    background:#f1edff;

    border-radius:6px;

    width:23px;
    height:23px;

    cursor:pointer;

    font-size:11px;
}

/* =====================================================
   FABRIC STUDIO
===================================================== */

.fabric-studio{
    display:none;

    margin-bottom:14px;
}

.fabric-studio.show{
    display:block;
}

.fabric-title{
    font-size:18px;

    font-weight:800;

    color:#5145a8;

    margin-bottom:4px;
}

.fabric-subtitle{
    font-size:11px;

    color:#888;

    margin-bottom:14px;
}

.fabric-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-bottom:15px;
}

.fabric-card{
    min-height:88px;

    border:1px solid #e5e0f3;

    background:white;

    border-radius:14px;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:3px;

    color:#555;

    transition:.2s;
}

.fabric-card:hover{
    transform:translateY(-2px);
}

.fabric-card.active{
    border:2px solid #6c5ce7;

    background:#f1edff;

    color:#5749c0;
}

.fabric-icon{
    font-size:24px;
}

.fabric-card strong{
    font-size:12px;
}

.fabric-card small{
    font-size:9px;

    color:#999;
}

.fabric-control{
    margin-bottom:14px;
}

.fabric-control label{
    display:flex;

    justify-content:space-between;

    font-size:11px;

    font-weight:700;

    color:#666;

    margin-bottom:5px;
}

.fabric-control input{
    width:100%;

    accent-color:#6c5ce7;
}

.fabric-mode-btn{
    width:100%;

    border:none;

    border-radius:12px;

    padding:11px;

    background:
        linear-gradient(
            135deg,
            #6c5ce7,
            #a55eea
        );

    color:white;

    font-weight:800;

    cursor:pointer;
}

.fabric-mode-btn.active{
    background:
        linear-gradient(
            135deg,
            #ff6b9d,
            #ff9f43
        );
}

/* ================= FONT STUDIO ================= */

.font-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;
}

.font-btn{
    border:1px solid #e4dff5;

    background:white;

    border-radius:10px;

    padding:9px 5px;

    cursor:pointer;

    font-size:13px;
}

.font-btn.active{
    border-color:#6c5ce7;

    background:#eeeaff;
}

.text-settings{
    display:none;
}

.text-settings.show{
    display:block;
}

.text-input{
    width:100%;

    border:1px solid #ddd6f0;

    border-radius:10px;

    padding:10px;

    outline:none;

    margin-bottom:8px;
}

.font-select{
    width:100%;

    border:1px solid #ddd6f0;

    background:white;

    border-radius:10px;

    padding:9px;

    margin-bottom:8px;
}

/* ================= OVERLAY ================= */

.panel-overlay{
    display:none;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    header{
        height:58px;

        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .header-btn{
        padding:8px 10px;

        font-size:12px;
    }

    .main{
        flex-direction:column;
    }

    .workspace{
        order:1;

        width:100%;

        height:auto;

        flex:1;
    }

    .toolbar{
        order:2;

        width:100%;

        height:76px;

        flex-shrink:0;

        border-right:none;

        border-top:1px solid #e8e3f5;

        flex-direction:row;

        justify-content:flex-start;

        padding:8px 10px;

        gap:8px;

        overflow-x:auto;

        overflow-y:hidden;
    }

    .tool{
        flex:0 0 58px;

        height:58px;
    }

    .tool-menu{
        display:flex;

        background:#6c5ce7;

        color:white;
    }

    .panel{
        position:absolute;

        right:0;

        top:0;

        bottom:76px;

        width:min(340px,90vw);

        border-left:1px solid #e2dcf3;

        box-shadow:
            -10px 0 35px
            rgba(50,40,90,.18);

        transform:translateX(105%);

        transition:
            transform .25s ease;

        z-index:250;
    }

    .panel.open{
        transform:translateX(0);
    }

    .panel-overlay{
        display:block;

        position:absolute;

        inset:0;

        background:
            rgba(35,25,60,.22);

        opacity:0;

        pointer-events:none;

        transition:opacity .25s ease;

        z-index:180;
    }

    .panel-overlay.open{
        opacity:1;

        pointer-events:auto;
    }

    .zoom-controls{
        bottom:10px;
    }
}

@media(max-width:430px){

    .header-btn:nth-child(2){
        display:none;
    }

    .panel{
        width:92vw;
    }

    .zoom-btn{
        width:32px;
        height:32px;
    }
}

</style>
</head>


<body>

<div class="app">

<header>

    <div class="logo">
        Draw<span>Lab</span> 🎨
    </div>

    <div class="header-actions">

        <button
            class="header-btn"
            onclick="newProject()">
            ＋ New
        </button>

        <button
            class="header-btn"
            onclick="exportPNG()">
            ⬇ Export
        </button>

    </div>

</header>


<div class="main">

<!-- =====================================================
     TOOLBAR
===================================================== -->

<aside class="toolbar">

    <button
        class="tool tool-menu"
        onclick="togglePanel()">

        ☰
        <small>Menu</small>

    </button>


    <button
        class="tool active"
        data-tool="select"
        onclick="setTool('select')">

        🖱️
        <small>Select</small>

    </button>


    <button
        class="tool"
        data-tool="brush"
        onclick="setTool('brush')">

        🖌️
        <small>Brush</small>

    </button>


    <button
        class="tool"
        data-tool="eraser"
        onclick="setTool('eraser')">

        🧽
        <small>Eraser</small>

    </button>


    <button
        class="tool"
        data-tool="fill"
        onclick="setTool('fill')">

        🪣
        <small>Fill</small>

    </button>


    <button
        class="tool"
        data-tool="picker"
        onclick="setTool('picker')">

        💧
        <small>Picker</small>

    </button>


    <button
        class="tool"
        data-tool="line"
        onclick="setTool('line')">

        ╱
        <small>Line</small>

    </button>


    <button
        class="tool"
        data-tool="rect"
        onclick="setTool('rect')">

        ▭
        <small>Square</small>

    </button>


    <button
        class="tool"
        data-tool="circle"
        onclick="setTool('circle')">

        ○
        <small>Circle</small>

    </button>


    <button
        class="tool"
        data-tool="text"
        onclick="setTool('text')">

        T
        <small>Text</small>

    </button>


    <button
        class="tool"
        data-tool="fabric"
        onclick="toggleFabricStudio()">

        🧵
        <small>Fabric</small>

    </button>


    <button
        class="tool"
        onclick="uploadImage()">

        🖼️
        <small>Image</small>

    </button>


    <input
        id="imageInput"
        type="file"
        accept="image/*"
        hidden>


    <button
        class="tool"
        onclick="undo()">

        ↶
        <small>Undo</small>

    </button>


    <button
        class="tool"
        onclick="redo()">

        ↷
        <small>Redo</small>

    </button>

</aside>


<!-- =====================================================
     WORKSPACE
===================================================== -->

<section
    class="workspace"
    id="workspace">

    <div
        class="canvas-wrap"
        id="canvasWrap">

        <canvas
            id="canvas"
            width="1000"
            height="700">
        </canvas>

    </div>


    <div class="zoom-controls">

        <button
            class="zoom-btn"
            onclick="zoomOut()">
            −
        </button>

        <div
            class="zoom-value"
            id="zoomValue">
            100%
        </div>

        <button
            class="zoom-btn"
            onclick="zoomIn()">
            +
        </button>

        <button
            class="zoom-btn"
            onclick="resetZoom()">
            ↺
        </button>

    </div>

</section>


<!-- MOBILE OVERLAY -->

<div
    class="panel-overlay"
    id="panelOverlay"
    onclick="closePanel()">
</div>


<!-- =====================================================
     PANEL
===================================================== -->

<aside
    class="panel"
    id="panel">


    <div class="panel-top">

        <div class="panel-title">
            🎨 DrawLab Studio
        </div>

        <button
            class="close-panel-btn"
            onclick="closePanel()">

            ✕

        </button>

    </div>


    <!-- FABRIC STUDIO -->

    <div
        class="fabric-studio"
        id="fabricStudio">

        <div class="fabric-title">
            🧵 Fabric Studio
        </div>

        <div class="fabric-subtitle">
            اختاري خامة القماش
        </div>


        <div class="fabric-grid">

            <button
                class="fabric-card active"
                data-fabric="satin"
                onclick="setFabric('satin')">

                <span class="fabric-icon">
                    ✨
                </span>

                <strong>Satin</strong>

                <small>
                    لامع وناعم
                </small>

            </button>


            <button
                class="fabric-card"
                data-fabric="silk"
                onclick="setFabric('silk')">

                <span class="fabric-icon">
                    🌙
                </span>

                <strong>Silk</strong>

                <small>
                    حريري
                </small>

            </button>


            <button
                class="fabric-card"
                data-fabric="chiffon"
                onclick="setFabric('chiffon')">

                <span class="fabric-icon">
                    🫧
                </span>

                <strong>Chiffon</strong>

                <small>
                    خفيف وشفاف
                </small>

            </button>


            <button
                class="fabric-card"
                data-fabric="crepe"
                onclick="setFabric('crepe')">

                <span class="fabric-icon">
                    〰️
                </span>

                <strong>Crepe</strong>

                <small>
                    مطفي وناعم
                </small>

            </button>


            <button
                class="fabric-card"
                data-fabric="velvet"
                onclick="setFabric('velvet')">

                <span class="fabric-icon">
                    🪶
                </span>

                <strong>Velvet</strong>

                <small>
                    ملمس غني
                </small>

            </button>


            <button
                class="fabric-card"
                data-fabric="cotton"
                onclick="setFabric('cotton')">

                <span class="fabric-icon">
                    ☁️
                </span>

                <strong>Cotton</strong>

                <small>
                    طبيعي
                </small>

            </button>

        </div>


        <div class="fabric-control">

            <label>

                <span>
                    ✨ Shine
                </span>

                <span
                    id="fabricShineValue">
                    60%
                </span>

            </label>

            <input
                type="range"
                id="fabricShine"
                min="0"
                max="100"
                value="60">

        </div>


        <div class="fabric-control">

            <label>

                <span>
                    🧶 Texture
                </span>

                <span
                    id="fabricTextureValue">
                    45%
                </span>

            </label>

            <input
                type="range"
                id="fabricTexture"
                min="0"
                max="100"
                value="45">

        </div>


        <button
            class="fabric-mode-btn"
            onclick="toggleRealisticFabric()">

            ✨ Realistic Fabric View

        </button>

    </div>


    <!-- COLORS -->

    <div class="panel-section">

        <div class="section-title">
            🎨 Colors
        </div>


        <div
            class="color-row"
            id="colorPalette">


            <button
                class="color active"
                style="background:#111111"
                data-color="#111111">
            </button>


            <button
                class="color"
                style="background:#ff4757"
                data-color="#ff4757">
            </button>


            <button
                class="color"
                style="background:#ff6b81"
                data-color="#ff6b81">
            </button>


            <button
                class="color"
                style="background:#ffa502"
                data-color="#ffa502">
            </button>


            <button
                class="color"
                style="background:#ffd32a"
                data-color="#ffd32a">
            </button>


            <button
                class="color"
                style="background:#2ed573"
                data-color="#2ed573">
            </button>


            <button
                class="color"
                style="background:#1e90ff"
                data-color="#1e90ff">
            </button>


            <button
                class="color"
                style="background:#3742fa"
                data-color="#3742fa">
            </button>


            <button
                class="color"
                style="background:#5352ed"
                data-color="#5352ed">
            </button>


            <button
                class="color"
                style="background:#a55eea"
                data-color="#a55eea">
            </button>


            <button
                class="color"
                style="background:#ff9ff3"
                data-color="#ff9ff3">
            </button>


            <button
                class="color"
                style="background:#ffffff"
                data-color="#ffffff">
            </button>

        </div>


        <br>


        <input
            type="color"
            id="customColor"
            class="custom-color"
            value="#111111">

    </div>


    <!-- BRUSHES -->

    <div class="panel-section">

        <div class="section-title">
            🖌️ Brush Library
        </div>


        <div class="brush-grid">

            <button
                class="brush active"
                data-brush="pencil"
                onclick="setBrush('pencil')">
                ✏️ Pencil
            </button>


            <button
                class="brush"
                data-brush="ink"
                onclick="setBrush('ink')">
                🖊️ Ink
            </button>


            <button
                class="brush"
                data-brush="marker"
                onclick="setBrush('marker')">
                🖍️ Marker
            </button>


            <button
                class="brush"
                data-brush="watercolor"
                onclick="setBrush('watercolor')">
                🎨 Water
            </button>


            <button
                class="brush"
                data-brush="neon"
                onclick="setBrush('neon')">
                ✨ Neon
            </button>


            <button

<script>

/* =========================================================
   DRAWLAB V5.3
========================================================= */

const canvas =

const ctx =
    canvas.getContext("2d");

const canvasWrap =
    document.getElementById("canvasWrap");

const panel =
    document.getElementById("panel");

const panelOverlay =

const opacityValue =

let objects = [];

let currentTool = "select";

let brushType = "pencil";

let brushSize = 8;

let brushOpacity = 1;

let zoom = 1;

let historyIndex = -1;

let dragOffset = null;


/* =========================================================
   FABRIC STATE
========================================================= */

let fabricMode = false;

let realisticFabric = false;

let currentFabric = "satin";

let fabricShine = .60;

let fabricTexture = .45;


const fabricSettings = {

    satin:{
        base:"#eee7ed",
        shine:.85,
        texture:.18
    },

    silk:{
        base:"#eee9df",
        shine:.95,
        texture:.12
    },

    chiffon:{
        base:"#eeeef5",
        shine:.45,
        texture:.10
    },

    crepe:{
        base:"#e8e4df",
        shine:.18,
        texture:.70
    },

        base:"#4e405d",

    },

        base:"#eee9df",

    }

};


/* =========================================================
   PANEL
========================================================= */

function togglePanel(){

}


/* =========================================================
   TOOL
========================================================= */

function setTool(tool){

    currentTool = tool;

    /*

/* =========================================================
   COLORS

document

========================================================= */

const brushSettings = {

    pencil:{
        size:4,
        opacity:.8
    },

    ink:{
        size:7,
        opacity:1
    },

    marker:{
        size:18,
        opacity:.7
    },

    watercolor:{
        size:28,
        opacity:.25
    },

        size:8,

    },

        size:30,

    }

};


function setBrush(type){

            b.classList.toggle(

function toggleRealisticFabric(){

        );


    btn.classList.toggle(

    );

/* =========================================================
   FABRIC SURFACE
========================================================= */

function drawFabricSurface(){

    const settings =
        fabricSettings[currentFabric];


    /*
       BASE
    */

    ctx.fillStyle =
        settings.base;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       FABRIC THREADS
    */

    const textureStrength =
        fabricTexture;


    ctx.save();

    ctx.globalAlpha =
        .025 +
        textureStrength * .12;

    ctx.strokeStyle =
        "#777";

    ctx.lineWidth = 1;


    let spacing = 7;


    if(
        currentFabric === "crepe"
    ){

        spacing = 4;

    }else if(
        currentFabric === "velvet"
    ){

        spacing = 5;

    }else if(
        currentFabric === "chiffon"
    ){

        spacing = 9;
    }


    for(
        let x=0;
        x<canvas.width;
        x+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x+10,
            canvas.height
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<canvas.height;
        y+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            canvas.width,
            y+10
        );

        ctx.stroke();

    }


    ctx.restore();


    /*
       SATIN / SILK LIGHT
    */

    if(
        currentFabric === "satin" ||
        currentFabric === "silk"
    ){

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                canvas.width,
                canvas.height
            );


        const shine =
            fabricShine;


        gradient.addColorStop(
            0,
            `rgba(
                255,
                255,
                255,
                ${.05 * shine}
            )`
        );


        gradient.addColorStop(
            .35,
            `rgba(
                255,
                255,
                255,
                ${.30 * shine}
            )`
        );


        gradient.addColorStop(
            .50,
            `rgba(
                255,
                255,
                255,
                ${.08 * shine}
            )`
        );


        gradient.addColorStop(
            .65,
            `rgba(
                255,
                255,
                255,
                ${.40 * shine}
            )`
        );


        gradient.addColorStop(
            1,
            `rgba(
                255,
                255,
                255,
                ${.03 * shine}
            )`
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }


    /*
       VELVET
    */

    if(
        currentFabric === "velvet"
    ){

        const gradient =
            ctx.createRadialGradient(
                canvas.width*.5,
                canvas.height*.4,
                50,
                canvas.width*.5,
                canvas.height*.5,
                canvas.width*.8
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,.12)"
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,.22)"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }


    /*
       CHIFFON
    */

    if(
        currentFabric === "chiffon"
    ){

        ctx.fillStyle =
            "rgba(255,255,255,.18)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }


    /*
       REALISTIC SHADOW / LIGHT
    */

    if(realisticFabric){

        const light =
            ctx.createRadialGradient(
                canvas.width*.35,
                canvas.height*.25,
                30,
                canvas.width*.5,
                canvas.height*.5,
                canvas.width*.8
            );


        light.addColorStop(
            0,
            `rgba(
                255,
                255,
                255,
                ${.20 * fabricShine}
            )`
        );


        light.addColorStop(
            .45,
            "rgba(255,255,255,0)"
        );


        light.addColorStop(
            1,
            "rgba(0,0,0,.12)"
        );


        ctx.fillStyle =
            light;


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

}


/* =========================================================
   FONT
========================================================= */

let selectedFont =
    "Arial";


function selectFont(
    font,
    button
){

    selectedFont =
        font;


    document
        .querySelectorAll(".font-btn")
        .forEach(
            b=>b.classList.remove(
                "active"
            )
        );

        );
    }

        "fontSelect"
    ).value =

}


document
.getElementById("fontSelect")
.addEventListener(
    "change",
    e=>{

        selectedFont =
            e.target.value;

    }
);


/* =========================================================
   CANVAS COORDINATES
========================================================= */

function getCanvasPoint(e){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (e.clientX - rect.left) *
            (
                canvas.width /
                rect.width
            ),

        y:
            (e.clientY - rect.top) *
            (
                canvas.height /
                rect.height
            )

    };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Fabric first
    */

    if(fabricMode){

        drawFabricSurface();

    }


    ctx.save();


    objects.forEach(
        obj=>{

            if(
                obj.visible === false
            ){
                return;
            }


            drawObject(obj);

        }
    );


    ctx.restore();


    /*
       Selection frame ONLY
       when Select tool is active
    */

    if(
        currentTool === "select" &&
        selectedId
    ){

        const obj =
            objects.find(
                o=>o.id === selectedId
            );


        if(obj){

            drawSelection(obj);

        }

    }

}


/* =========================================================
   DRAW OBJECT
========================================================= */

function drawObject(obj){

    ctx.save();


    ctx.globalAlpha =
        obj.opacity ?? 1;


    if(
        obj.type === "stroke"
    ){

        drawStroke(obj);

    }


    else if(
        obj.type === "line"
    ){

        drawLine(obj);

    }


    else if(
        obj.type === "rect"
    ){

        drawRect(obj);

    }


    else if(
        obj.type === "circle"
    ){

        drawCircle(obj);

    }


    else if(
        obj.type === "text"
    ){

        drawText(obj);

    }


    else if(
        obj.type === "image"
    ){

        if(obj.img){

            drawImage(obj);

        }

    }


    ctx.restore();

}


/* =========================================================
   STROKE
========================================================= */

function drawStroke(obj){

    if(
        !obj.points ||
        !obj.points.length
    ){
        return;
    }


    ctx.save();


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    let alpha =
        obj.opacity ?? 1;


    if(
        obj.brush === "watercolor"
    ){

        ctx.globalAlpha =
            alpha * .35;

    }


    if(
        obj.brush === "marker"
    ){

        ctx.globalAlpha =
            alpha * .7;

    }


    if(
        obj.brush === "spray"
    ){

        drawSpray(obj);

        ctx.restore();

        return;
    }


    if(
        obj.brush === "neon"
    ){

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            obj.color;

    }


    ctx.strokeStyle =
        obj.color;

    ctx.lineWidth =
        obj.size;


    ctx.beginPath();


    obj.points.forEach(
        (p,i)=>{

            if(i === 0){

                ctx.moveTo(
                    p.x,
                    p.y
                );

            }else{

                ctx.lineTo(
                    p.x,
                    p.y
                );

            }

        }
    );


    ctx.stroke();


    ctx.restore();

}


function drawSpray(obj){

    ctx.fillStyle =
        obj.color;


    obj.points.forEach(
        p=>{

            for(
                let i=0;
                i<20;
                i++
            ){

                const angle =
                    Math.random() *
                    Math.PI * 2;


                const radius =
                    Math.random() *
                    obj.size;


                const x =
                    p.x +
                    Math.cos(angle) *
                    radius;


                const y =
                    p.y +
                    Math.sin(angle) *
                    radius;


                ctx.globalAlpha =
                    (obj.opacity ?? 1) *
                    Math.random() *
                    .35;


                ctx.beginPath();


                ctx.arc(
                    x,
                    y,
                    Math.random()*2+1,
                    0,
                    Math.PI*2
                );


                ctx.fill();

            }

        }
    );

}


/* =========================================================
   SHAPES
========================================================= */

function drawLine(obj){

    ctx.strokeStyle =
        obj.color;

    ctx.lineWidth =
        obj.size;

    ctx.lineCap =
        "round";


    ctx.beginPath();


    ctx.moveTo(
        obj.x1,
        obj.y1
    );


    ctx.lineTo(
        obj.x2,
        obj.y2
    );


    ctx.stroke();

}


function drawRect(obj){

    ctx.strokeStyle =
        obj.color;

    ctx.lineWidth =
        obj.size;


    ctx.strokeRect(
        obj.x,
        obj.y,
        obj.w,
        obj.h
    );

}


function drawCircle(obj){

    ctx.strokeStyle =
        obj.color;

    ctx.lineWidth =
        obj.size;


    ctx.beginPath();


    ctx.ellipse(
        obj.cx,
        obj.cy,
        Math.abs(obj.rx),
        Math.abs(obj.ry),
        0,
        0,
        Math.PI*2
    );


    ctx.stroke();

}


/* =========================================================
   TEXT
========================================================= */

function drawText(obj){

    ctx.fillStyle =
        obj.color;


    ctx.font =
        `${obj.size}px ${obj.font || "Arial"}`;


    ctx.textBaseline =
        "top";


    ctx.fillText(
        obj.text,
        obj.x,
        obj.y
    );

}


/* =========================================================
   IMAGE
========================================================= */

function drawImage(obj){

    ctx.save();


    ctx.translate(
        obj.x + obj.w/2,
        obj.y + obj.h/2
    );


    ctx.rotate(
        obj.rotation || 0
    );


    ctx.drawImage(
        obj.img,
        -obj.w/2,
        -obj.h/2,
        obj.w,
        obj.h
    );


    ctx.restore();

}


/* =========================================================
   BOUNDS
========================================================= */

function getBounds(obj){

    if(
        obj.type === "stroke"
    ){

        if(
            !obj.points ||
            !obj.points.length
        ){

            return {
                x:0,
                y:0,
                w:0,
                h:0
            };

        }


        const xs =
            obj.points.map(
                p=>p.x
            );


        const ys =
            obj.points.map(
                p=>p.y
            );


        return {

            x:Math.min(...xs),

            y:Math.min(...ys),

            w:
                Math.max(...xs) -
                Math.min(...xs),

            h:
                Math.max(...ys) -
                Math.min(...ys)

        };

    }


    if(
        obj.type === "line"
    ){

        return {

            x:
                Math.min(
                    obj.x1,
                    obj.x2
                ),

            y:
                Math.min(
                    obj.y1,
                    obj.y2
                ),

            w:
                Math.abs(
                    obj.x2 -
                    obj.x1
                ),

            h:
                Math.abs(
                    obj.y2 -
                    obj.y1
                )

        };

    }


    if(
        obj.type === "rect"
    ){

        return {

            x:
                Math.min(
                    obj.x,
                    obj.x + obj.w
                ),

            y:
                Math.min(
                    obj.y,
                    obj.y + obj.h
                ),

            w:
                Math.abs(obj.w),

            h:
                Math.abs(obj.h)

        };

    }


    if(
        obj.type === "circle"
    ){

        return {

            x:
                obj.cx -
                Math.abs(obj.rx),

            y:
                obj.cy -
                Math.abs(obj.ry),

            w:
                Math.abs(obj.rx)*2,

            h:
                Math.abs(obj.ry)*2

        };

    }


    if(
        obj.type === "text"
    ){

        ctx.save();


        ctx.font =
            `${obj.size}px ${
                obj.font || "Arial"
            }`;


        const width =
            ctx.measureText(
                obj.text
            ).width;


        ctx.restore();


        return {

            x:obj.x,

            y:obj.y,

            w:width,

            h:obj.size*1.2

        };

    }


    if(
        obj.type === "image"
    ){

        return {

            x:obj.x,

            y:obj.y,

            w:obj.w,

            h:obj.h

        };

    }


    return {
        x:0,
        y:0,
        w:0,
        h:0
    };

}


/* =========================================================
   SELECTION
========================================================= */

function drawSelection(obj){

    const b =
        getBounds(obj);


    ctx.save();


    ctx.strokeStyle =
        "#6c5ce7";

    ctx.lineWidth = 2;

    ctx.setLineDash(
        [6,5]
    );


    ctx.strokeRect(
        b.x-6,
        b.y-6,
        b.w+12,
        b.h+12
    );


    ctx.setLineDash([]);


    ctx.fillStyle =
        "#6c5ce7";


    ctx.beginPath();


    ctx.arc(
        b.x+b.w/2,
        b.y-14,
        5,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   HIT TEST
========================================================= */

function hitTest(x,y){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const obj =
            objects[i];


        const b =
            getBounds(obj);


        const padding = 12;


        if(
            x >= b.x-padding &&
            x <= b.x+b.w+padding &&
            y >= b.y-padding &&
            y <= b.y+b.h+padding
        ){

            return obj;

        }

    }


    return null;

}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();


        const p =
            getCanvasPoint(e);


        pointerStart =
            p;


        /*
           SELECT
        */

        if(
            currentTool === "select"
        ){

            const obj =
                hitTest(
                    p.x,
                    p.y
                );


            selectedId =
                obj
                    ? obj.id
                    : null;


            if(obj){

                dragOffset = {

                    x:p.x,
                    y:p.y

                };


                saveHistory();

            }


            render();

            updateLayers();

            return;

        }


        /*
           COLOR PICKER
        */

        if(
            currentTool === "picker"
        ){

            pickColor(
                p.x,
                p.y
            );

            return;

        }


        /*
           FILL
        */

        if(
            currentTool === "fill"
        ){

            fillAt(
                p.x,
                p.y
            );

            return;

        }


        /*
           TEXT
        */

        if(
            currentTool === "text"
        ){

            createText(
                p.x,
                p.y
            );

            return;

        }


        drawing = true;


        startX =
            p.x;

        startY =
            p.y;


        saveHistory();


        /*
           BRUSH / ERASER
        */

        if(
            currentTool === "brush" ||
            currentTool === "eraser"
        ){

            currentObject = {

                id:uid(),

                type:"stroke",

                points:[
                    {
                        x:p.x,
                        y:p.y
                    }
                ],

                color:
                    currentTool === "eraser"
                        ? (
                            fabricMode
                                ? fabricSettings[
                                    currentFabric
                                  ].base
                                : "#ffffff"
                          )
                        : currentColor,

                size:brushSize,

                opacity:
                    currentTool === "eraser"
                        ? 1
                        : brushOpacity,

                brush:brushType,

                visible:true

            };


            objects.push(
                currentObject
            );


            selectedId =
                currentObject.id;

        }


        /*
           LINE
        */

        else if(
            currentTool === "line"
        ){

            currentObject = {

                id:uid(),

                type:"line",

                x1:p.x,

                y1:p.y,

                x2:p.x,

                y2:p.y,

                color:currentColor,

                size:brushSize,

                opacity:brushOpacity,

                visible:true

            };


            objects.push(
                currentObject
            );


            selectedId =
                currentObject.id;

        }


        /*
           RECT
        */

        else if(
            currentTool === "rect"
        ){

            currentObject = {

                id:uid(),

                type:"rect",

                x:p.x,

                y:p.y,

                w:0,

                h:0,

                color:currentColor,

                size:brushSize,

                opacity:brushOpacity,

                visible:true

            };


            objects.push(
                currentObject
            );


            selectedId =
                currentObject.id;

        }


        /*
           CIRCLE
        */

        else if(
            currentTool === "circle"
        ){

            currentObject = {

                id:uid(),

                type:"circle",

                cx:p.x,

                cy:p.y,

                rx:0,

                ry:0,

                color:currentColor,

                size:brushSize,

                opacity:brushOpacity,

                visible:true

            };


            objects.push(
                currentObject
            );


            selectedId =
                currentObject.id;

        }


        /*
           IMPORTANT:
           No selection frame while drawing.
        */

        render();

        updateLayers();

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    e=>{

        e.preventDefault();


        const p =
            getCanvasPoint(e);


        /*
           SELECT
        */

        if(
            currentTool === "select"
        ){

            if(
                selectedId &&
                pointerStart &&
                dragOffset
            ){

                const obj =
                    objects.find(
                        o=>
                            o.id ===
                            selectedId
                    );


                if(obj){

                    const dx =
                        p.x -
                        pointerStart.x;


                    const dy =
                        p.y -
                        pointerStart.y;


                    moveObject(
                        obj,
                        dx,
                        dy
                    );


                    pointerStart =
                        p;

                }


                render();

            }


            return;

        }


        if(
            !drawing ||
            !currentObject
        ){

            return;

        }


        /*
           BRUSH
        */

        if(
            currentTool === "brush" ||
            currentTool === "eraser"
        ){

            currentObject.points.push({

                x:p.x,

                y:p.y

            });

        }


        /*
           LINE
        */

        else if(
            currentTool === "line"
        ){

            currentObject.x2 =
                p.x;

            currentObject.y2 =
                p.y;

        }


        /*
           RECT
        */

        else if(
            currentTool === "rect"
        ){

            currentObject.w =
                p.x - startX;

            currentObject.h =
                p.y - startY;

        }


        /*
           CIRCLE
        */

        else if(
            currentTool === "circle"
        ){

            currentObject.rx =
                p.x - startX;

            currentObject.ry =
                p.y - startY;

        }


        render();

    }
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    e=>{

        drawing = false;

        currentObject = null;

        pointerStart = null;

        dragOffset = null;


        render();

        updateLayers();

    }
);


canvas.addEventListener(
    "pointercancel",
    e=>{

        drawing = false;

        currentObject = null;

        pointerStart = null;

        dragOffset = null;


        render();

    }
);


/* =========================================================
   MOVE OBJECT
========================================================= */

function moveObject(
    obj,
    dx,
    dy
){

    if(
        obj.type === "stroke"
    ){

        obj.points.forEach(
            p=>{

                p.x += dx;

                p.y += dy;

            }
        );

    }


    else if(
        obj.type === "line"
    ){

        obj.x1 += dx;
        obj.y1 += dy;

        obj.x2 += dx;
        obj.y2 += dy;

    }


    else if(
        obj.type === "rect"
    ){

        obj.x += dx;
        obj.y += dy;

    }


    else if(
        obj.type === "circle"
    ){

        obj.cx += dx;
        obj.cy += dy;

    }


    else if(
        obj.type === "text"
    ){

        obj.x += dx;
        obj.y += dy;

    }


    else if(
        obj.type === "image"
    ){

        obj.x += dx;
        obj.y += dy;

    }

}


/* =========================================================
   CREATE TEXT
========================================================= */

function createText(

){

        );

        obj.id;


    render();

    updateLayers();

}


/* =========================================================
   COLOR PICKER
========================================================= */

function pickColor(
    x,
    y
){

    const pixel =
        ctx.getImageData(
            x,
            y,
            1,
            1
        ).data;


    const hex =
        "#" +
        [pixel[0],pixel[1],pixel[2]]
        .map(
            n=>
                n.toString(16)
                 .padStart(2,"0")
        )
        .join("");


    currentColor =
        hex;


    document.getElementById(
        "customColor"
    ).value =
        hex;


    document
        .querySelectorAll(".color")
        .forEach(
            c=>
                c.classList.remove(
                    "active"
                )
        );


    setTool("brush");

}


/* =========================================================
   FILL
========================================================= */

function fillAt(
    x,
    y
){

    /*
       For V5.3 the Fill works on
       the visible canvas pixels.

       It is intentionally kept separate
       from object layers so it doesn't
       destroy the old drawing engine.
    */


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const px =
        Math.floor(x);

    const py =
        Math.floor(y);


    const index =
        (py * canvas.width + px) * 4;


    const targetR =
        imageData.data[index];

    const targetG =
        imageData.data[index+1];

    const targetB =
        imageData.data[index+2];

    const targetA =
        imageData.data[index+3];


    const fillColor =
        hexToRGBA(
            currentColor
        );


    if(
        colorsClose(
            targetR,
            targetG,
            targetB,
            targetA,
            fillColor.r,
            fillColor.g,
            fillColor.b,
            fillColor.a
        )
    ){

        return;

    }


    saveHistory();


    const stack = [
        [px,py]
    ];


    const tolerance = 25;


    while(stack.length){

        const point =
            stack.pop();


        const cx =
            point[0];

        const cy =
            point[1];


        if(
            cx < 0 ||
            cy < 0 ||
            cx >= canvas.width ||
            cy >= canvas.height
        ){

            continue;

        }


        const i =
            (cy * canvas.width + cx) * 4;


        const r =
            imageData.data[i];

        const g =
            imageData.data[i+1];

        const b =
            imageData.data[i+2];

        const a =
            imageData.data[i+3];


        if(
            Math.abs(r-targetR) > tolerance ||
            Math.abs(g-targetG) > tolerance ||
            Math.abs(b-targetB) > tolerance ||
            Math.abs(a-targetA) > tolerance
        ){

            continue;

        }


        imageData.data[i] =
            fillColor.r;

        imageData.data[i+1] =
            fillColor.g;

        imageData.data[i+2] =
            fillColor.b;

        imageData.data[i+3] =
            255;


        stack.push(
            [cx+1,cy],
            [cx-1,cy],
            [cx,cy+1],
            [cx,cy-1]
        );

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    /*
       Make filled result an image object
       so it participates in our system.
    */

    const image =
        new Image();


    image.onload = ()=>{

        const obj = {

            id:uid(),

            type:"image",

            x:0,

            y:0,

            w:canvas.width,

            h:canvas.height,

            rotation:0,

            imageSrc:
                canvas.toDataURL(),

            img:image,

            opacity:1,

            visible:true,

            isFillLayer:true

        };


        /*
           We don't want to duplicate
           the complete canvas visually.
           This is only used as a stable
           fill snapshot.
        */

    };


    image.src =
        canvas.toDataURL();


    render();

}


/* =========================================================
   COLOR HELPERS
========================================================= */

function hexToRGBA(
    hex
){

    hex =
        hex.replace(
            "#",
            ""
        );


    if(hex.length === 3){

        hex =
            hex.split("")
                .map(c=>c+c)
                .join("");

    }


    return {

        r:
            parseInt(
                hex.substring(0,2),
                16
            ),

        g:
            parseInt(
                hex.substring(2,4),
                16
            ),

        b:
            parseInt(
                hex.substring(4,6),
                16
            ),

        a:255

    };

}


function colorsClose(
    r1,g1,b1,a1,
    r2,g2,b2,a2
){

    return (

        Math.abs(r1-r2) <= 25 &&

        Math.abs(g1-g2) <= 25 &&

        Math.abs(b1-b2) <= 25 &&

        Math.abs(a1-a2) <= 25

    );

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

function uploadImage(){

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


document
.getElementById("imageInput")
.addEventListener(
    "change",
    e=>{

        const file =
            e.target.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(){


                const img =
                    new Image();


                img.onload =
                    function(){


                        saveHistory();


                        const maxW =
                            450;

                        const maxH =
                            350;


                        let w =
                            img.width;

                        let h =
                            img.height;


                        const scale =
                            Math.min(
                                maxW/w,
                                maxH/h,
                                1
                            );


                        w *= scale;

                        h *= scale;


                        const obj = {

                            id:uid(),

                            type:"image",

                            x:
                                (
                                    canvas.width-w
                                )/2,

                            y:
                                (
                                    canvas.height-h
                                )/2,

                            w:w,

                            h:h,

                            rotation:0,

                            imageSrc:
                                reader.result,

                            img:img,

                            opacity:1,

                            visible:true

                        };


                        objects.push(
                            obj
                        );


                        selectedId =
                            obj.id;


                        render();

                        updateLayers();

                    };


                img.src =
                    reader.result;

            };


        reader.readAsDataURL(
            file
        );


        e.target.value = "";

    }
);


/* =========================================================
   HISTORY
========================================================= */

function serialize(){

    return JSON.stringify(

        objects.map(
            obj=>{

                const copy =
                    {...obj};

                delete copy.img;

                return copy;

            }
        )

    );

}


function saveHistory(){

    const state =
        serialize();


    history =
        history.slice(
            0,
            historyIndex+1
        );


    history.push(
        state
    );


    historyIndex =
        history.length-1;


    if(
        history.length > 50
    ){

        history.shift();

        historyIndex--;

    }

}


function restoreState(
    state
){

    objects =
        JSON.parse(
            state
        );


    selectedId =
        null;


    rebuildImages();


    render();

    updateLayers();

}


function rebuildImages(){

    objects.forEach(
        obj=>{

            if(
                obj.type === "image" &&
                obj.imageSrc
            ){

                const img =
                    new Image();


                img.onload =
                    ()=>{

                        obj.img =
                            img;

                        render();

                    };


                img.src =
                    obj.imageSrc;

            }

        }
    );

}


function undo(){

    if(
        historyIndex <= 0
    ){

        return;

    }


    historyIndex--;


    restoreState(
        history[
            historyIndex
        ]
    );

}


function redo(){

    if(
        historyIndex >=
        history.length-1
    ){

        return;

    }


    historyIndex++;


    restoreState(
        history[
            historyIndex
        ]
    );

}


/* =========================================================
   LAYERS
========================================================= */

function updateLayers(){

    const container =
        document.getElementById(
            "layers"
        );


    container.innerHTML =
        "";


    [...objects]
    .reverse()
    .forEach(
        obj=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "layer" +
                (
                    obj.id === selectedId
                        ? " active"
                        : ""
                );


            let icon =
                "✏️";


            if(
                obj.type === "image"
            ){

                icon = "🖼️";

            }


            if(
                obj.type === "text"
            ){

                icon = "T";

            }


            if(
                obj.type === "rect"
            ){

                icon = "▭";

            }


            if(
                obj.type === "circle"
            ){

                icon = "○";

            }


            if(
                obj.type === "line"
            ){

                icon = "╱";

            }


            const name =
                obj.type === "stroke"
                    ? obj.brush
                    : obj.type;


            div.innerHTML = `

                <span>
                    ${icon}
                </span>

                <span class="layer-name">
                    ${name}
                </span>

                <div class="layer-actions">

                    <button
                        onclick="
                            event.stopPropagation();
                            selectLayer('${obj.id}')
                        ">
                        👁
                    </button>

                    <button
                        onclick="
                            event.stopPropagation();
                            deleteLayer('${obj.id}')
                        ">
                        🗑
                    </button>

                </div>

            `;


            div.onclick =
                ()=>{

                    selectedId =
                        obj.id;


                    setTool(
                        "select"
                    );


                    render();

                    updateLayers();

                };


            container.appendChild(
                div
            );

        }
    );

}


function selectLayer(
    id
){

    selectedId =
        id;


    setTool(
        "select"
    );

}


function deleteLayer(
    id
){

    saveHistory();


    objects =
        objects.filter(
            o=>o.id !== id
        );


    if(
        selectedId === id
    ){

        selectedId =
            null;

    }


    render();

    updateLayers();

}


/* =========================================================
   OBJECT ACTIONS
========================================================= */

function getSelected(){

    return objects.find(
        o=>
            o.id ===
            selectedId
    );

}


function deleteSelected(){

    if(!selectedId){

        return;

    }


    saveHistory();


    objects =
        objects.filter(
            o=>
                o.id !== selectedId
        );


    selectedId =
        null;


    render();

    updateLayers();

}


function duplicateSelected(){

    const obj =
        getSelected();


    if(!obj){

        return;

    }


    saveHistory();


    const copy =
        JSON.parse(
            JSON.stringify(
                {
                    ...obj,
                    img:undefined
                }
            )
        );


    copy.id =
        uid();


    moveObject(
        copy,
        30,
        30
    );


    if(
        obj.type === "image"
    ){

        const img =
            new Image();


        img.onload =
            ()=>{

                copy.img =
                    img;

                render();

            };


        img.src =
            obj.imageSrc;

    }


    objects.push(
        copy
    );


    selectedId =
        copy.id;


    render();

    updateLayers();

}


function moveLayerUp(){

    if(!selectedId){

        return;

    }


    const index =
        objects.findIndex(
            o=>
                o.id ===
                selectedId
        );


    if(
        index === -1 ||
        index === objects.length-1
    ){

        return;

    }


    saveHistory();


    [
        objects[index],
        objects[index+1]
    ] =
    [
        objects[index+1],
        objects[index]
    ];


    render();

    updateLayers();

}


function moveLayerDown(){

    if(!selectedId){

        return;

    }


    const index =
        objects.findIndex(
            o=>
                o.id ===
                selectedId
        );


    if(index <= 0){

        return;

    }


    saveHistory();


    [
        objects[index],
        objects[index-1]
    ] =
    [
        objects[index-1],
        objects[index]
    ];


    render();

    updateLayers();

}

   CLEAR

function clearCanvas(){

    if(

/* =========================================================
   ZOOM
========================================================= */

function updateZoom(){

    canvasWrap.style.transform =
        `translate(-50%,-50%) scale(${zoom})`;


    document.getElementById(
        "zoomValue"
    ).textContent =
        Math.round(
            zoom*100
        ) + "%";

}


function zoomIn(){

    zoom =
        Math.min(
            zoom+.1,
            3
        );


    updateZoom();

}


function zoomOut(){

    zoom =
        Math.max(
            zoom-.1,
            .3
        );


    updateZoom();

}


function resetZoom(){

    zoom =
        1;


    updateZoom();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA" ||
            e.target.tagName === "SELECT"
        ){

            return;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "z"
        ){

            e.preventDefault();

            undo();

        }


        if(
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "y"
        ){

            e.preventDefault();

            redo();

        }


        if(
            e.key === "Delete"
        ){

            deleteSelected();

        }


        if(
            e.key.toLowerCase() === "b"
        ){

            setTool("brush");

        }


        if(
            e.key.toLowerCase() === "e"
        ){

            setTool("eraser");

        }


        if(
            e.key.toLowerCase() === "v"
        ){

            setTool("select");

        }


        if(
            e.key.toLowerCase() === "t"
        ){

            setTool("text");

        }


        if(
            e.key === "Escape"
        ){

            closePanel();

            selectedId =
                null;

            render();

            updateLayers();

        }

    }
);


/* =========================================================
